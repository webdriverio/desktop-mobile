[package]
name = "dioxus-package-test-app"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dioxus-package-test-app"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7", features = ["desktop"] }
wdio-dioxus-embedded-driver = { path = "../../../../packages/dioxus-embedded-driver" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Temporary patch until upstream Dioxus releases the matching API. See
# fixtures/e2e-apps/dioxus/Cargo.toml for the same patch and rationale.
[patch.crates-io]
dioxus = { git = "https://github.com/goosewobbler/dioxus.git", branch = "feat/desktop-background-throttling-policy-v0.7.9" }
dioxus-core = { git = "https://github.com/goosewobbler/dioxus.git", branch = "feat/desktop-background-throttling-policy-v0.7.9" }
dioxus-desktop = { git = "https://github.com/goosewobbler/dioxus.git", branch = "feat/desktop-background-throttling-policy-v0.7.9" }
