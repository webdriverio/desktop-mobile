[package]
name = "dioxus-package-test-app"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dioxus-package-test-app"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7", features = ["desktop"] }
wdio-dioxus-embedded-driver = { path = "../../../../packages/dioxus-embedded-driver" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Note: the upstream-dioxus [patch.crates-io] block lives at the workspace
# root Cargo.toml. Cargo ignores [patch] in non-root members, so the patch
# must be declared once at the workspace root to apply to this crate.
