# Materialised as pnpm-workspace.yaml by scripts/test-package.ts inside the isolated
# package-test sandbox. Deliberately not named pnpm-workspace.yaml: that would make this
# fixture its own workspace root in the monorepo and strand its workspace:* deps.
allowBuilds:
  electron: true
  esbuild: true
overrides:
  minimatch: 10.2.2
