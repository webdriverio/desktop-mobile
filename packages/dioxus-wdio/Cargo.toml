[package]
name = "wdio-dioxus"
version = "1.1.0-next.0"
authors = [ "WebdriverIO Community" ]
categories = [ "development-tools::testing", "gui" ]
license = "Apache-2.0 OR MIT"
homepage = "https://github.com/webdriverio/desktop-mobile"
repository = "https://github.com/webdriverio/desktop-mobile"
description = "Connects a Dioxus desktop app to @wdio/dioxus-service for WebdriverIO testing"
readme = "README.md"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "wdio_dioxus"
path = "src/lib.rs"

[features]
default = [ "embedded" ]
embedded = [ "dep:wdio-dioxus-embedded-driver" ]

[dependencies]
dioxus-desktop = "0.7"
tracing = "0.1"

[dependencies.wdio-dioxus-bridge]
path = "../dioxus-bridge"
version = "1.0.0-next.0"

[dependencies.wdio-dioxus-embedded-driver]
path = "../dioxus-embedded-driver"
version = "1.0.0-next.0"
optional = true
