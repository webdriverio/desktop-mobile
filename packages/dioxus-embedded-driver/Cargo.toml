[package]
name = "wdio-dioxus-embedded-driver"
version = "1.1.0"
authors = [ "WebdriverIO Community" ]
categories = [ "development-tools::testing", "gui" ]
license = "Apache-2.0 OR MIT"
homepage = "https://github.com/webdriverio/desktop-mobile"
repository = "https://github.com/webdriverio/desktop-mobile"
description = "Embedded WebDriver server for @wdio/dioxus-service — runs inside the Dioxus app process and communicates with the webview via the bridge IPC channel"
readme = "README.md"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "wdio_dioxus_embedded_driver"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
base64 = "0.22"
dioxus-desktop = "0.7"
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dependencies.wdio-dioxus-bridge]
path = "../dioxus-bridge"
version = "1.0.0-next.0"

[dependencies.serde]
version = "1"
features = [ "derive" ]

[dependencies.tokio]
version = "1"
features = [ "rt-multi-thread", "sync", "net", "time" ]

[dependencies.uuid]
version = "1"
features = [ "v4" ]

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
block2 = "0.6"

[target."cfg(target_os = \"macos\")".dependencies.objc2-foundation]
version = "0.3"
default-features = false
features = [ "std", "NSString", "NSData", "NSError", "NSDictionary" ]

[target."cfg(target_os = \"macos\")".dependencies.objc2-app-kit]
version = "0.3"
default-features = false
features = [ "std", "NSImage", "NSImageRep", "NSBitmapImageRep" ]

[target."cfg(target_os = \"macos\")".dependencies.objc2-web-kit]
version = "0.3"
default-features = false
features = [ "std", "WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit" ]

# Matches the webview2-com and windows versions wry links, so the
# `ICoreWebView2` it hands out is the same type this crate calls.
[target."cfg(target_os = \"windows\")".dependencies]
webview2-com = "0.38"

[target."cfg(target_os = \"windows\")".dependencies.windows]
version = "0.61"
features = [ "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage" ]

# Same semver lines as wry and gtk, so Cargo resolves the one copy they use and
# the `webkit2gtk::WebView` wry hands out is the type this crate calls. A
# caret, not wry's exact pin, so a wry patch bump can't make resolution fail.
# cairo-rs is here only to turn on PNG encoding.
[target."cfg(target_os = \"linux\")".dependencies]
webkit2gtk = "2.0"

[target."cfg(target_os = \"linux\")".dependencies.cairo-rs]
version = "0.18"
features = [ "png" ]
