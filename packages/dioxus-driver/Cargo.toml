[package]
name = "wdio-dioxus-driver"
version = "1.0.0-next.1"
authors = [ "WebdriverIO Community" ]
categories = [ "gui", "web-programming" ]
license = "Apache-2.0 OR MIT"
homepage = "https://github.com/webdriverio/desktop-mobile"
repository = "https://github.com/webdriverio/desktop-mobile"
description = "WebDriver intermediary node for Dioxus desktop applications (forked from tauri-driver)"
readme = "README.md"
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "wdio-dioxus-driver"
path = "src/main.rs"

[dependencies]
anyhow = "1"
futures = "0.3"
futures-util = "0.3"
http-body-util = "0.1"
serde_json = "1"
which = "8"

[dependencies.hyper]
version = "1"
features = [ "client", "http1", "server" ]

[dependencies.hyper-util]
version = "0.1"
features = [ "client", "client-legacy", "http1", "server", "tokio" ]

[dependencies.pico-args]
version = "0.5"
features = [ "eq-separator" ]

[dependencies.serde]
version = "1"
features = [ "derive" ]

[dependencies.tokio]
version = "1"
features = [ "macros" ]

[target."cfg(unix)".dependencies]
signal-hook = "0.4"

[target."cfg(unix)".dependencies.signal-hook-tokio]
version = "0.4"
features = [ "futures-v0_3" ]

[target."cfg(windows)".dependencies]
win32job = "2"
