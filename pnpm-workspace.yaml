packages:
  - packages/*
  - examples/*
  - e2e
  - fixtures/e2e-apps/electron-builder
  - fixtures/e2e-apps/electron-forge
  - fixtures/e2e-apps/electron-script
  - fixtures/e2e-apps/tauri
  - fixtures/e2e-apps/dioxus
  - fixtures/package-tests/electron-builder-app-cjs
  - fixtures/package-tests/electron-builder-app-esm
  - fixtures/package-tests/electron-forge-app-cjs
  - fixtures/package-tests/electron-forge-app-esm
  - fixtures/package-tests/electron-script-app-cjs
  - fixtures/package-tests/electron-script-app-esm
  - fixtures/package-tests/tauri-app
  - fixtures/package-tests/dioxus-app
allowBuilds:
  edgedriver: false
  electron: true
  electron-nightly: true
  electron-winstaller: false
  esbuild: true
  geckodriver: false
blockExoticSubdeps: false
# Pin puppeteer-core to the v24 line that still supports Node 18 (matches
# the shipped engines field of @wdio/electron-service). Without this override
# pnpm hoists v25 to satisfy webdriverio's puppeteer-core peerDep range
# `>=22.x || <=24.x` — the OR makes it effectively unconstrained, so pnpm
# happily picks v25 (which requires Node 22.12+). Drop this override when
# we move to WDIO v10 and bump our engines past Node 18.
overrides:
  puppeteer-core: ^24.41.0
catalogs:
  default:
    '@wdio/cli': ^9.27.1
    '@wdio/globals': ^9.27.1
    '@wdio/local-runner': ^9.27.1
    '@wdio/logger': ^9.18.0
    '@wdio/mocha-framework': ^9.27.1
    '@wdio/spec-reporter': ^9.27.1
    '@wdio/types': 9.27.1
    '@wdio/xvfb': ^9.27.1
    electron: 42.2.0
    webdriverio: ^9.27.1
  minimum:
    '@wdio/cli': ^8.43.0
    '@wdio/globals': ^8.43.0
    '@wdio/local-runner': ^8.43.0
    '@wdio/logger': ^8.41.0
    '@wdio/mocha-framework': ^8.41.0
    '@wdio/spec-reporter': ^9.19.1
    '@wdio/types': ^8.41.0
    '@wdio/xvfb': ^9.19.1
    electron: 28.3.3
    webdriverio: ^8.43.0
  next:
    '@wdio/cli': latest
    '@wdio/globals': latest
    '@wdio/local-runner': latest
    '@wdio/logger': latest
    '@wdio/mocha-framework': latest
    '@wdio/spec-reporter': latest
    '@wdio/types': latest
    '@wdio/xvfb': latest
    electron-nightly: 44.0.0-nightly.20260521
    webdriverio: latest
