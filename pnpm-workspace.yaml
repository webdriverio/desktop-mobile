  - packages/*
  - examples/*
  - e2e
  - fixtures/e2e-apps/electron-builder
  - fixtures/e2e-apps/electron-forge
  - fixtures/e2e-apps/electron-script
  - fixtures/e2e-apps/tauri
  - fixtures/e2e-apps/dioxus
  - fixtures/e2e-apps/electrobun
  - fixtures/package-tests/electron-builder-app-cjs
  - fixtures/package-tests/electron-builder-app-esm
  - fixtures/package-tests/electron-forge-app-cjs
  - fixtures/package-tests/electron-forge-app-esm
  - fixtures/package-tests/electron-script-app-cjs
  - fixtures/package-tests/electron-script-app-esm
  - fixtures/package-tests/tauri-app
  - fixtures/package-tests/dioxus-app
  - fixtures/package-tests/electrobun-app
  - fixtures/package-tests/react-native-app
  - fixtures/package-tests/flutter-app
allowBuilds:
  appium: false
  appium-ios-tuntap: false
  bufferutil: false
  edgedriver: false
  electron: true
  electron-nightly: true
  electron-winstaller: false
  esbuild: true
  geckodriver: false
  utf-8-validate: false
blockExoticSubdeps: false
# pnpm's own default, declared so `pnpm config get hoist-pattern` reports it. Electron
# Forge's preflight refuses pnpm unless node-linker is "hoisted" or a hoist pattern is
# merely *defined*, and it no longer sees the .npmrc that used to satisfy that. Changes
# no linking behaviour. Drop once electron/forge#4188 lands.
hoistPattern:
  - "*"
# appium-ios-device reads bplist-parser's `.default.UID` at module load; bplist-parser@0.5.0 (now
# type:module) breaks that CJS-interop shape, so requiring appium-flutter-driver -> appium-xcuitest-driver
# -> appium-ios-device throws "Cannot read properties of undefined (reading 'UID')" and the Flutter
# driver never registers. Hold the last CJS release until appium-ios-device fixes the import.
overrides:
  bplist-parser: 0.3.2
