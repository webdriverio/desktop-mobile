packages:
  - packages/*
  - examples/*
  - e2e
  - fixtures/e2e-apps/electron-builder
  - fixtures/e2e-apps/electron-forge
  - fixtures/e2e-apps/electron-script
  - fixtures/e2e-apps/tauri
  - fixtures/e2e-apps/dioxus
  - fixtures/e2e-apps/electrobun
  - fixtures/package-tests/electron-builder-app-cjs
  - fixtures/package-tests/electron-builder-app-esm
  - fixtures/package-tests/electron-forge-app-cjs
  - fixtures/package-tests/electron-forge-app-esm
  - fixtures/package-tests/electron-script-app-cjs
  - fixtures/package-tests/electron-script-app-esm
  - fixtures/package-tests/tauri-app
  - fixtures/package-tests/dioxus-app
  - fixtures/package-tests/electrobun-app
allowBuilds:
  edgedriver: false
  electron: true
  electron-nightly: true
  electron-winstaller: false
  esbuild: true
  geckodriver: false
blockExoticSubdeps: false
# yauzl@2 (via extract-zip → @electron/packager) is broken on Node 24.16+; the
# Forge maintainer recommends overriding to yauzl@3.3.1 until extract-zip is
# replaced. See electron/forge#4277 and electron/electron#51619.
overrides:
  yauzl: ^3.3.1
catalogs:
  default:
    '@wdio/cli': 9.27.1
    '@wdio/globals': 9.27.1
    '@wdio/local-runner': 9.27.1
    '@wdio/logger': 9.18.0
    '@wdio/mocha-framework': 9.27.1
    '@wdio/spec-reporter': 9.27.1
    '@wdio/types': 9.27.1
    '@wdio/xvfb': 9.27.1
    webdriverio: 9.27.1
    electron: 41.7.2
    electron-builder: 26.8.1
    '@electron-forge/cli': 7.11.2
  # Non-default catalogs only need entries for deps whose version differs from
  # `default`. The switch script falls back to `catalog:default` for any dep
  # not listed here (e.g. when an upstream dep is new and has no older
  # equivalent to put in `minimum`).
  minimum:
    '@wdio/cli': v8
    '@wdio/globals': v8
    '@wdio/local-runner': v8
    '@wdio/logger': v8
    '@wdio/mocha-framework': v8
    '@wdio/spec-reporter': v8
    '@wdio/types': v8
    electron: 28.3.3
    webdriverio: v8
  next:
    '@wdio/cli': latest
    '@wdio/globals': latest
    '@wdio/local-runner': latest
    '@wdio/logger': latest
    '@wdio/mocha-framework': latest
    '@wdio/spec-reporter': latest
    '@wdio/types': latest
    '@wdio/xvfb': latest
    electron-nightly: 44.0.0-nightly.20260610
    electron-builder: next
    webdriverio: latest
