version: 2
updates:
  # For main branch
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - 'area:dependencies'
    groups:
      wdio-dependencies:
        patterns:
          - '@wdio/*'
          - 'webdriver'
          - 'webdriverio'
      # Keep CrabNebula bumps in their own PR: a new @crabnebula/test-runner-backend release is the
      # trigger to re-check #179 (Tauri logging via CrabNebula on macOS). logging.crabnebula-tripwire
      # flips that PR's tauri e2e leg red if the new version forwards app stdout/stderr.
      crabnebula:
        patterns:
          - '@crabnebula/*'
      production-dependencies:
        dependency-type: 'production'
        patterns:
          - '*'
        exclude-patterns:
          - '@wdio/*'
          - 'webdriver'
          - 'webdriverio'
          - '@crabnebula/*'
      development-dependencies:
        dependency-type: 'development'
        patterns:
          - '*'
        exclude-patterns:
          - '@wdio/*'
          - 'webdriver'
          - 'webdriverio'
          - '@crabnebula/*'
    ignore:
      # For all packages, ignore major updates
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # For `electron-builder`, ignore all updates (they break things)
      - dependency-name: 'electron-builder'
        update-types: ['version-update:semver-major', 'version-update:semver-minor', 'version-update:semver-patch']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      # Check for updates to GitHub Actions every week
      interval: 'weekly'
    open-pull-requests-limit: 10
    labels:
      - 'area:dependencies'
  # Rust crates + Tauri/Dioxus fixture apps. Cargo.lock is committed, so drift now
  # arrives as a gated, reviewable PR instead of an ambient CI break.
  - package-ecosystem: 'cargo'
    directories:
      - '/packages/dioxus-bridge'
      - '/packages/dioxus-driver'
      - '/packages/dioxus-embedded-driver'
      - '/packages/tauri-plugin'
      - '/packages/tauri-plugin-webdriver'
      - '/fixtures/e2e-apps/dioxus'
      - '/fixtures/e2e-apps/tauri'
      - '/fixtures/package-tests/dioxus-app'
      - '/fixtures/package-tests/tauri-app'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    labels:
      - 'area:dependencies'
    groups:
      cargo-dependencies:
        patterns:
          - '*'
    ignore:
      # Ignore major updates (mirrors the npm policy above)
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
