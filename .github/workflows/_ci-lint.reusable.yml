name: Lint
# Description: Runs code quality checks across the codebase

permissions:
  contents: read

on:
  workflow_call:
    # Make this a reusable workflow, no value needed
    # https://docs.github.com/en/actions/using-workflows/reusing-workflows

env:
  TURBO_TELEMETRY_DISABLED: 1
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # This job runs linting checks to ensure code quality
  # It only needs to run on a single OS (Ubuntu) since linting rules are platform-independent
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Standard checkout with SSH key for private repositories
      - name: 👷 Checkout Repository
        uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      # Set up Node.js and PNPM using the reusable action
      - name: 🛠️ Setup Development Environment
        uses: ./.github/workflows/actions/setup-workspace
        with:
          node-version: '24'

      # Cache ESLint and Prettier results
      - name: 📦 Cache Linting Results
        uses: actions/cache@v5
        with:
          path: |
            .eslintcache
            node_modules/.cache/prettier
          key: linting-${{ runner.os }}-${{ hashFiles('eslint.config.js', '.prettierrc*', 'package.json') }}-${{ github.ref_name }}
          restore-keys: |
            linting-${{ runner.os }}-${{ hashFiles('eslint.config.js', '.prettierrc*', 'package.json') }}-
            linting-${{ runner.os }}-

      # Run Linting checks
      - name: 🔍 Run Linting
        run: pnpm run lint
        shell: bash

      # Run Formatting checks
      - name: 🔍 Run Format Check
        run: pnpm run format:check
        shell: bash

      # Unit tests + typecheck for repo tooling (scripts/), notably the CI change
      # classifier that gates every other job — run here because lint is the one
      # job with no `if:` gate.
      - name: 🔍 Run Scripts Tests
        run: pnpm run test:scripts
        shell: bash

      - name: 🔍 Typecheck Scripts
        run: pnpm run typecheck:scripts
        shell: bash

      # Static analysis of GitHub Actions workflows. Catches schema errors,
      # bad expressions, and shellcheck issues in `run:` scripts. Installs
      # the binary via the upstream download script — the third-party
      # marketplace wrappers have flaky npm-based setup on newer runners.
      - name: 🔍 Run actionlint
        shell: bash
        # Restrict to top-level workflow files. actionlint's auto-discovery
        # also walks .github/workflows/actions/*/action.yml, but composite
        # actions use a different schema and (incorrectly) fail the
        # workflow-schema checks if passed in.
        run: |
          bash <(curl --silent --show-error --fail \
            https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color .github/workflows/*.yml
