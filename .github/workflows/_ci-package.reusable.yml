name: Package
# Description: Runs package tests across different operating systems

permissions:
  contents: read

on:
  workflow_call:
    # Make this a reusable workflow, no value needed
    # https://docs.github.com/en/actions/using-workflows/reusing-workflows
    inputs:
      os:
        description: 'Operating system to run tests on'
        type: string
        required: true
      service:
        description: 'Service to test (electron, tauri, dioxus, electrobun, or all)'
        type: string
        required: false
        default: 'all'
      module-type:
        description: 'Module type for Electron package tests (cjs, esm, or both)'
        type: string
        required: false
        default: 'both'
      build_id:
        description: 'Build ID from the build job'
        type: string
        required: false
      artifact_size:
        description: 'Size of the build artifact in bytes'
        type: string
        required: false
      cache_key:
        description: 'Cache key to use for downloading artifacts'
        type: string
        required: false
      tauri_cache_key:
        description: 'Cache key for Tauri package test app binaries'
        type: string
        required: false
      dioxus_cache_key:
        description: 'Cache key for Dioxus package test app binaries'
        type: string
        required: false

env:
  TURBO_TELEMETRY_DISABLED: 1
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # This job runs package tests on multiple Node.js versions and operating systems
  package:
    name: Run
    runs-on: ${{ inputs.os }}
    steps:
      # Standard checkout with SSH key for private repositories
      - name: 👷 Checkout Repository
        uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      # Set up Node.js and PNPM using the reusable action
      - name: 🛠️ Setup Development Environment
        uses: ./.github/workflows/actions/setup-workspace
        with:
          node-version: '24'

      # Install Rust toolchain for auto-installing tauri-driver if testing Tauri service
      # The @wdio/tauri-service will automatically install tauri-driver via cargo if not found
      - name: 🦀 Setup Rust (for tauri-driver auto-install)
        if: inputs.service == 'tauri' || inputs.service == 'all'
        shell: bash
        run: rustup update stable && rustup default stable && rustup component add rustfmt

      # Install Dioxus GTK/WebKit runtime dependencies for Linux (required to run the desktop app)
      - name: 🦀 Install Dioxus Runtime Dependencies (Linux)
        if: inputs.service == 'dioxus' && runner.os == 'Linux'
        shell: bash
        run: |
          echo "Installing Dioxus runtime dependencies for Linux..."
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-0 \
            libgtk-3-0t64 \
            libayatana-appindicator3-1 \
            libxdo3 \
            xvfb

      # Install WebKit WebDriver and GTK/X11 runtime dependencies for Linux (required by tauri-driver)
      # Note: Build dependencies are handled in the build workflows, we only need runtime libs for testing
      - name: 🌐 Install WebKit WebDriver and GTK/X11 Runtime Dependencies (Linux)
        if: (inputs.service == 'tauri' || inputs.service == 'all') && runner.os == 'Linux'
        shell: bash
        run: |
          echo "Installing WebKit WebDriver and GTK/X11 runtime dependencies for Linux..."
          sudo apt-get update
          sudo apt-get install -y \
            webkit2gtk-driver \
            libwebkit2gtk-4.1-0 \
            libgtk-3-0 \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libcups2 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            xvfb
          # Verify installation
          which WebKitWebDriver || echo "WebKitWebDriver not found in PATH"
          WebKitWebDriver --version || echo "WebKitWebDriver version check failed"

      # Download the pre-built packages from the build job
      # This ensures all tests use the same build artifacts
      - name: 📦 Download Build Artifacts
        uses: ./.github/workflows/actions/download-archive
        with:
          name: wdio-desktop-mobile
          path: wdio-desktop-mobile-build
          filename: artifact.zip
          cache_key_prefix: wdio-desktop-build
          exact_cache_key: ${{ inputs.cache_key || github.run_id && format('{0}-{1}-{2}-{3}{4}', 'Linux', 'wdio-desktop-build', 'wdio-desktop-mobile', github.run_id, github.run_attempt > 1 && format('-rerun{0}', github.run_attempt) || '') || '' }}

      # Download app binaries if testing services that require pre-built apps
      # The download-archive action extracts to workspace root, preserving directory structure
      # Tauri: Archive contains fixtures/package-tests/tauri-app/target
      # Dioxus: Archive contains fixtures/package-tests/dioxus-app/target
      # Electron: Apps are built in isolated environments by test-package.ts script
      - name: 📦 Download Dioxus Package Test App Binary
        if: inputs.service == 'dioxus'
        uses: ./.github/workflows/actions/download-archive
        with:
          name: dioxus-package-app-${{ runner.os }}-${{ runner.arch == 'ARM64' && 'ARM64' || 'x64' }}
          path: dioxus-package-app-${{ runner.os }}-${{ runner.arch == 'ARM64' && 'ARM64' || 'x64' }}
          filename: artifact.zip
          cache_key_prefix: dioxus-package-app
          exact_cache_key: ${{ inputs.dioxus_cache_key || '' }}

      - name: 📦 Download Tauri Package Test App Binary
        if: inputs.service == 'tauri' || inputs.service == 'all'
        uses: ./.github/workflows/actions/download-archive
        with:
          name: tauri-package-app-${{ runner.os }}-${{ runner.arch == 'ARM64' && 'ARM64' || 'x64' }}
          path: tauri-package-app-${{ runner.os }}-${{ runner.arch == 'ARM64' && 'ARM64' || 'x64' }}
          filename: artifact.zip
          cache_key_prefix: tauri-package-app
          exact_cache_key: ${{ inputs.tauri_cache_key || '' }}

      # Electrobun is a CEF/Bun build whose macOS .app carries framework symlinks; it
      # ships as a symlink-preserving tarball via actions/upload-artifact (NOT the
      # zip-based download-archive used above), mirroring the e2e flow. macOS-only.
      - name: 📦 Download Electrobun Package Test App Bundle
        if: inputs.service == 'electrobun'
        uses: actions/download-artifact@v8
        with:
          name: electrobun-package-app-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}

      - name: 🗜️ Extract Electrobun Bundle
        if: inputs.service == 'electrobun'
        shell: bash
        run: |
          mkdir -p fixtures/package-tests/electrobun-app
          # Windows: --force-local so GNU tar reads D:\… as a path, not a remote host ("Cannot
          # connect to D:") — matches the build workflow's archive step. macOS bsdtar lacks the flag.
          flags=""
          [ "$RUNNER_OS" = "Windows" ] && flags="--force-local"
          tar $flags -xzpf "${RUNNER_TEMP}/electrobun-package-app.tgz" -C fixtures/package-tests/electrobun-app
          if [ ! -d "fixtures/package-tests/electrobun-app/build" ]; then
            echo "::error::Electrobun package-app build dir not found — bundle was not extracted correctly."
            find fixtures/package-tests/electrobun-app/ -maxdepth 1 || true
            exit 1
          fi

      # Verify the extracted dist directories exist
      - name: 🔍 Verify Extracted Files
        id: verify-build
        shell: bash
        run: |
          # Only output build info if it's available
          if [ -n "${{ inputs.build_id }}" ] && [ -n "${{ inputs.artifact_size }}" ]; then
            echo "::notice::Build artifact: ID=${{ inputs.build_id }}, Size=${{ inputs.artifact_size }} bytes"
          fi

          # Check for distribution directories (minimal validation)
          DIST_DIRS=$(find "${{ github.workspace }}" -path "*/dist" -type d | wc -l)
          if [ "$DIST_DIRS" -lt 1 ]; then
            echo "::warning::No dist directories found, build extraction may have failed"
          fi

        # Pack services from downloaded artifacts so --skip-build can use them
        # This creates the .tgz files that the test script expects when --skip-build is used
      - name: 📦 Pack Services from Artifacts
        shell: bash
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          echo "Packing services from downloaded artifacts..."
          # Pack all native-* packages
          for package in packages/native-*; do
            if [ -d "$package/dist" ]; then
              echo "Packing $package..."
              (cd "$package" && pnpm pack)
            fi
          done

          # Pack Electron service and dependencies if needed
          if [ "$SERVICE" == "electron" ] || [ "$SERVICE" == "all" ]; then
            if [ -d "packages/electron-cdp-bridge/dist" ]; then
              (cd packages/electron-cdp-bridge && pnpm pack)
            fi
            if [ -d "packages/electron-service/dist" ]; then
              (cd packages/electron-service && pnpm pack)
            fi
          fi

           # Pack Tauri service and plugin if needed
           if [ "$SERVICE" == "tauri" ] || [ "$SERVICE" == "all" ]; then
             if [ -d "packages/tauri-plugin/dist-js" ]; then
               (cd packages/tauri-plugin && pnpm pack)
             fi
             if [ -d "packages/tauri-service/dist" ]; then
               (cd packages/tauri-service && pnpm pack)
             fi
           fi

           # Pack Dioxus service if needed
           if [ "$SERVICE" == "dioxus" ]; then
             if [ -d "packages/dioxus-service/dist" ]; then
               (cd packages/dioxus-service && pnpm pack)
             fi
           fi

           # Pack Electrobun service + its CDP bridge if needed
           if [ "$SERVICE" == "electrobun" ]; then
             if [ -d "packages/native-cdp-bridge/dist" ]; then
               (cd packages/native-cdp-bridge && pnpm pack)
             fi
             if [ -d "packages/electrobun-service/dist" ]; then
               (cd packages/electrobun-service && pnpm pack)
             fi
           fi

      # Run package tests using test-package.ts script
      # All apps are built in isolated environments (Electron always, Tauri if not skipBuild)
      # Tauri uses skipBuild to copy pre-built binaries from separate build jobs
      - name: 🧪 Execute Package Tests
        shell: bash
        env:
          # Enable Rust backtraces for debugging Tauri/GTK issues
          RUST_BACKTRACE: '1'
          # Disable AT-SPI accessibility bus warnings (same as E2E)
          NO_AT_BRIDGE: '1'
          SERVICE: ${{ inputs.service }}
        run: |
          case "$SERVICE" in
            electron)
              echo "Running Electron package tests (apps built in isolated environments)"
              echo "Module type: ${{ inputs.module-type }}"
              pnpm run test:package:electron -- --module-type=${{ inputs.module-type }}
              ;;
            dioxus)
              echo "Running Dioxus package tests (using pre-built binaries from separate build job)"
              if [[ "${{ runner.os }}" == "Linux" ]]; then
                echo "Using xvfb-run to provide a DISPLAY on Linux (${{ inputs.os }})"
                xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x16" \
                  pnpm run test:package:dioxus -- --skip-build
              else
                pnpm run test:package:dioxus -- --skip-build
              fi
              ;;
            tauri)
              echo "Running Tauri package tests (using pre-built binaries from separate build job)"
              if [[ "${{ runner.os }}" == "Linux" ]]; then
                echo "Using xvfb-run to provide a DISPLAY on Linux (${{ inputs.os }})"
                # Use 16-bit color depth to avoid pixbuf issues with GTK/WebKit (same as E2E)
                xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x16" \
                  pnpm run test:package:tauri -- --skip-build
              else
                pnpm run test:package:tauri -- --skip-build
              fi
              ;;
            all)
              if [[ "${{ runner.os }}" == "macOS" ]]; then
                echo "⚠️  Skipping Tauri package tests on macOS (not supported)"
                echo "Module type: ${{ inputs.module-type }}"
                pnpm run test:package:electron -- --module-type=${{ inputs.module-type }}
              else
                echo "Running all package tests (Electron built in isolated environments, Tauri using pre-built binaries)"
                echo "Module type: ${{ inputs.module-type }}"
                # Electron: build in isolated environments (no --skip-build)
                pnpm run test:package:electron -- --module-type=${{ inputs.module-type }}
                # Tauri: use --skip-build for pre-built binaries from separate build job
                # Wrap with xvfb-run since tauri-driver runs in launcher (not worker) per wdio.conf.ts comment
                # Use 16-bit color depth to avoid pixbuf issues with GTK/WebKit (same as E2E)
                xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x16" \
                  pnpm run test:package:tauri -- --skip-build
              fi
              ;;
            electrobun)
              # macOS-only (CEF). Uses the pre-built bundle extracted above; no xvfb (macOS).
              echo "Running Electrobun package tests (macOS-only; using the pre-built CEF bundle)"
              pnpm run test:package:electrobun -- --skip-build
              ;;
            *)
              echo "Invalid service: $SERVICE"
              exit 1
              ;;
          esac

      # Upload logs as artifacts for later analysis (same as E2E tests)
      # This helps debug issues without cluttering the GitHub Actions console
      - name: 📦 Upload Package Test Logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: package-test-logs-${{ inputs.os }}-${{ inputs.service }}-${{ inputs.module-type || 'default' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/package-tests/*.log
          retention-days: 90
          if-no-files-found: warn

      # Provide an interactive debugging session on failure
      # This allows manual investigation of the environment
      - name: 🐛 Debug Build on Failure
        uses: goosewobbler/vscode-server-action@v1.5.0
        if: failure()
        with:
          timeout: '180000'
