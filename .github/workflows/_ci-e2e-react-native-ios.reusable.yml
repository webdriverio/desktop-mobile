name: E2E Tests - React Native (iOS)
# Description: iOS-simulator E2E for @wdio/react-native-service. The .app is built by a
# sibling CI job (_ci-build-react-native-ios-app) that runs in parallel with the package build; this
# workflow downloads that artifact, re-scaffolds JS for Metro (no CocoaPods/xcodebuild), and
# drives the simulator. The split keeps the heavy xcodebuild OFF the E2E runner: when both
# shared one runner, appium-xcuitest's session-create (its `xcrun --show-sdk-version` SDK probe
# + the WebDriverAgent build) was starved by the just-finished xcodebuild and timed out at 15s.
# A debug .app loads its JS from Metro at runtime, so the freshly-scaffolded project (same
# pinned RN version + App.tsx) serves a compatible bundle; the simulator shares the host
# loopback, so no adb-reverse equivalent is needed.

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      os:
        description: 'Runner OS (macos-latest)'
        required: true
        type: string
      node-version:
        description: 'Node.js version'
        required: true
        type: string
      test-type:
        description: 'Test scenario (standard)'
        type: string
        default: 'standard'
      rn-version:
        description: 'React Native version to scaffold the native project with'
        type: string
        default: '0.76.5'
      rn-cli-version:
        description: '@react-native-community/cli major to scaffold with (pinned to match rn-version)'
        type: string
        default: '15'
      ios-device:
        description: 'Simulator device name'
        type: string
        default: 'iPhone 17'
      new-arch:
        description: 'Build the fixture with the New Architecture (Fabric/bridgeless) enabled'
        type: boolean
        default: false
      build_id:
        type: string
        required: false
      artifact_size:
        type: string
        required: false
      cache_key:
        type: string
        required: false

env:
  TURBO_TELEMETRY_DISABLED: 1
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  RN_BUILD_DIR: ${{ github.workspace }}/rn-build
  # Explicit, shared DerivedData for the prebuilt WebDriverAgent: the pre-build step writes here and
  # the run reads the Runner.app under it (appium:prebuiltWDAPath), so the cached WDA is reused, not
  # rebuilt.
  RN_WDA_DD: ${{ github.workspace }}/wda_dd

jobs:
  run:
    name: Run
    runs-on: ${{ inputs.os }}
    # Cap a hung Appium/WDA session (a stuck session-create can otherwise idle the macOS runner for
    # the 6h default). Generous over a normal pass (~16-24 min) but well under the default.
    timeout-minutes: 55
    steps:
      - name: 👷 Checkout Repository
        uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: 🛠️ Setup Development Environment
        uses: ./.github/workflows/actions/setup-workspace
        with:
          node-version: ${{ inputs.node-version }}

      # The e2e link-deps resolve against the prebuilt package dist from the build job.
      - name: 📦 Download Build Artifacts
        uses: ./.github/workflows/actions/download-archive
        with:
          name: wdio-desktop-mobile
          path: wdio-desktop-mobile-build
          filename: artifact.zip
          cache_key_prefix: wdio-desktop-build
          exact_cache_key: ${{ inputs.cache_key || github.run_id && format('{0}-{1}-{2}-{3}{4}', 'Linux', 'wdio-desktop-build', 'wdio-desktop-mobile', github.run_id, github.run_attempt > 1 && format('-rerun{0}', github.run_attempt) || '') || '' }}

      - name: 📥 Download built .app
        uses: actions/download-artifact@v8
        with:
          # Matches the build job's run_id-only name so a `--failed` rerun (which doesn't rebuild)
          # still finds the artifact from the original attempt.
          name: rn-ios-app-${{ inputs.new-arch && 'new' || 'old' }}-arch-${{ github.run_id }}
          path: ${{ github.workspace }}/rn-app-dl

      - name: 📦 Unpack built .app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/rn-app"
          tar -xzf "$GITHUB_WORKSPACE/rn-app-dl/rn-ios-app.tar.gz" -C "$GITHUB_WORKSPACE/rn-app"
          APP_PATH="$GITHUB_WORKSPACE/rn-app/ReactNativeE2EApp.app"
          test -d "$APP_PATH" || { echo "::error::unpacked .app not found at $APP_PATH"; exit 1; }
          echo "RN_APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      # Keyed identically to the build job's npm cache so the first fetch is already warm —
      # the cli init downloads the same tarballs for the same pinned RN version.
      - name: 💾 Restore npm download cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-rn-${{ inputs.rn-version }}-v1

      # Metro is JS-only — re-scaffold the project here (without CocoaPods/xcodebuild) so the
      # heavy native build stays in the build job. A debug .app loads its bundle from Metro at
      # runtime; the same pinned RN version + App.tsx yields a compatible bundle.
      - name: 🏗️ Scaffold JS project for Metro
        shell: bash
        env:
          RN_VERSION: ${{ inputs.rn-version }}
          RN_CLI_VERSION: ${{ inputs.rn-cli-version }}
        run: |
          set -euo pipefail
          npx --yes "@react-native-community/cli@$RN_CLI_VERSION" init ReactNativeE2EApp \
            --version "$RN_VERSION" --directory "$RN_BUILD_DIR" --skip-git-init --pm npm --install-pods false
          cp fixtures/e2e-apps/react-native/App.tsx "$RN_BUILD_DIR/App.tsx"

      # Warm the Xcode toolchain on the fresh runner before the Appium session: appium-xcuitest
      # probes the SDK with `xcrun --show-sdk-version` under a 15s timeout, and the first cold
      # invocation can exceed it. Pre-resolving it here makes the in-session probe instant.
      - name: 🔥 Warm Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "Xcode: $(xcode-select -p)"
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list devices available >/dev/null

      - name: 📲 Boot iOS simulator
        shell: bash
        env:
          RN_IOS_DEVICE: ${{ inputs.ios-device }}
        run: |
          set -euo pipefail
          # Resolve a concrete UDID for the device name and act on THAT throughout. Booting by name
          # is ambiguous when the runner image carries duplicate device names across runtimes; appium
          # then resolves the name independently and can monitor/boot a different instance than we
          # booted here — a source of the "failed to finish booting" first-session flake (#359). We
          # export RN_IOS_UDID so the wdio config pins appium:udid to this exact simulator.
          # Prefer the newest runtime (highest SimRuntime key) when a name appears more than once.
          DEVICES=$(xcrun simctl list devices available --json)
          UDID=$(echo "$DEVICES" | jq -r --arg name "$RN_IOS_DEVICE" \
                'first(.devices | to_entries | sort_by(.key) | reverse | .[].value[] | select(.name == $name) | .udid) // empty')
          if [ -z "$UDID" ]; then
            # Requested device absent on this runner image (Xcode versions drift across GitHub's
            # macOS images), so fall back to the newest available "iPhone <N>" and pin its UDID.
            # `|| true`: with an empty jq result `read` exits 1, which under `set -e` would kill the
            # step before the guard below — losing the error annotation + device-list diagnostic.
            read -r UDID RN_IOS_DEVICE < <(echo "$DEVICES" | jq -r \
              '[.devices[][] | select(.name | test("^iPhone [0-9]"))]
               | (max_by([(.name | capture("^iPhone (?<n>[0-9]+)").n | tonumber), -(.name | length)])) as $c
               | if $c == null then empty else "\($c.udid) \($c.name)" end') || true
            test -n "$UDID" || { echo "::error::No available iPhone simulator (requested '${{ inputs.ios-device }}')"; xcrun simctl list devices available; exit 1; }
            # Warn + write to the run summary (a passing job's annotations are easy to miss) so a
            # perpetually-absent default gets noticed and bumped. See #510.
            DRIFT="Requested iOS simulator '${{ inputs.ios-device }}' not on this runner; using '$RN_IOS_DEVICE'. Refresh the ios-device default (#510) once it's absent across runner images."
            echo "::warning::$DRIFT"
            printf '⚠️ **iOS simulator drift (RN):** %s\n' "$DRIFT" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi
          echo "Using simulator $RN_IOS_DEVICE ($UDID)"
          echo "RN_IOS_UDID=$UDID" >> "$GITHUB_ENV"
          # Propagate the resolved name so the wdio config's appium:deviceName matches the pinned UDID.
          echo "RN_IOS_DEVICE=$RN_IOS_DEVICE" >> "$GITHUB_ENV"
          # Tolerate "already booted" but fail loudly on a genuine error rather than masking it into
          # a later cryptic Appium "device not found".
          if ! xcrun simctl boot "$UDID" 2>/tmp/boot.err; then
            if grep -qiE "already booted|current state: Booted" /tmp/boot.err; then
              echo "Simulator already booted"
            else
              echo "::error::Failed to boot simulator '$RN_IOS_DEVICE' ($UDID):"; cat /tmp/boot.err
              exit 1
            fi
          fi
          # bootstatus -b blocks until the sim reaches Booted; a non-zero exit is a real
          # boot failure/timeout — surface it here, not later as a cryptic Appium session error.
          xcrun simctl bootstatus "$UDID" -b || { echo "::error::Simulator '$UDID' did not reach Booted state"; exit 1; }

      - name: 🔌 Install Appium XCUITest driver
        shell: bash
        # Idempotent: appium exits 1 if the driver is already registered.
        run: |
          set -euo pipefail
          if pnpm --filter @repo/e2e exec appium driver list --installed 2>&1 | grep -qi xcuitest; then
            echo "xcuitest driver already installed"
          else
            pnpm --filter @repo/e2e exec appium driver install xcuitest
          fi

      # WDA DerivedData is keyed on e2e/package.json (xcuitest driver pin) AND the runner
      # image version. ImageVersion is set automatically on GitHub-hosted macOS runners and
      # encodes the Xcode major — a stale DerivedData compiled against a previous SDK causes
      # cryptic E2E failures rather than a clean miss-and-rebuild.
      # Key also hashes pnpm-lock.yaml — the WDA/xcuitest versions resolve through the lockfile
      # (incl. transitive copies), so a lockfile-only bump must bust the cache too.
      # -v3: the pre-build now selects the WDA matching the loaded driver (was building a stale
      # transitive copy); bump forces a rebuild so a v2 entry holding the wrong WDA isn't reused.
      - name: 💾 Restore WDA DerivedData cache
        id: wda-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.RN_WDA_DD }}
          key: wda-dd-${{ runner.os }}-${{ env.ImageVersion }}-${{ hashFiles('e2e/package.json', 'pnpm-lock.yaml') }}-v3

      # Pre-build WebDriverAgent deterministically with a plain xcodebuild (no appium session, so no
      # socket fragility — it runs to completion). appium-xcuitest otherwise compiles WDA (several
      # minutes) on the first graded session, and under WDIO's undici client that long POST /session
      # dropped the socket (UND_ERR_SOCKET) and failed the first spec. Building here, then launching
      # the Runner.app via appium:usePreinstalledWDA + prebuiltWDAPath (simctl install/launch, no
      # in-session xcodebuild), means the graded sessions skip the build and are fast.
      - name: 🏎️ Pre-build WebDriverAgent
        if: steps.wda-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Build the WebDriverAgent that the appium-xcuitest-driver Appium actually loads depends
          # on. Two appium-webdriveragent copies coexist in the pnpm store: the pinned xcuitest
          # driver's (15.x) and an older one pulled transitively via appium-flutter-driver's bundled
          # xcuitest (11.x). A bare `find | head -1` picked the stale 11.x project, so the
          # preinstalled WDA never matched the 15.x launcher — it launched but its :8100 server never
          # came up and session-create timed out at wdaLaunchTimeout on every spec. Resolve the
          # project from the driver; fall back to the newest copy by version if resolution fails.
          WDA_PROJ=""
          WDA_DIR=$(pnpm --filter @repo/e2e exec node -e "const p=require('path');const x=require.resolve('appium-xcuitest-driver/package.json');process.stdout.write(p.dirname(require.resolve('appium-webdriveragent/package.json',{paths:[p.dirname(x)]})))" 2>/dev/null || true)
          if [ -n "$WDA_DIR" ] && [ -d "$WDA_DIR/WebDriverAgent.xcodeproj" ]; then
            WDA_PROJ="$WDA_DIR/WebDriverAgent.xcodeproj"
          else
            WDA_PROJ=$(find node_modules/.pnpm -maxdepth 6 -path '*/appium-webdriveragent/WebDriverAgent.xcodeproj' -type d 2>/dev/null | sort -V | tail -1)
          fi
          test -n "$WDA_PROJ" && test -d "$WDA_PROJ" || { echo "::error::WebDriverAgent.xcodeproj not found under node_modules"; exit 1; }
          echo "WDA project: $WDA_PROJ"
          xcodebuild build-for-testing \
            -project "$WDA_PROJ" \
            -scheme WebDriverAgentRunner \
            -derivedDataPath "$RN_WDA_DD" \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO GCC_TREAT_WARNINGS_AS_ERRORS=0 2>&1 | (xcbeautify || cat)
          RUNNER_APP="$RN_WDA_DD/Build/Products/Debug-iphonesimulator/WebDriverAgentRunner-Runner.app"
          test -d "$RUNNER_APP" || { echo "::error::prebuilt WDA runner not found at $RUNNER_APP"; find "$RN_WDA_DD/Build/Products" 2>/dev/null | head -40; exit 1; }
          echo "✅ WDA prebuilt at $RUNNER_APP"

      - name: 🧪 Run E2E on iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          # RN_IOS_DEVICE / RN_IOS_UDID are inherited from the boot step via $GITHUB_ENV.
          # Metro is now service-managed (manageMetro + prebundle): the @wdio/react-native-service
          # launcher starts `react-native start`, waits for /status, force-compiles the JS bundle
          # (so the first launch doesn't land on the "Bundling…" overlay), and tears it down. The
          # simulator reaches it over the shared host loopback (no adb-reverse needed on iOS). This
          # leg is the direct e2e verification of that lifecycle (replaces the manual
          # start + wait-on + curl-prebundle previously here).
          # Run the e2e suite and the package smoke DECOUPLED: capture each exit code with `|| rc=$?`
          # (so a failed e2e suite doesn't abort the step before the smoke runs) and fail at the end
          # if either failed. The smoke validates the PACKED tarball — its signal must survive an
          # (occasionally flaky) e2e failure. It stays second so it runs on a sim+Metro the suite warmed.
          e2e_rc=0; pnpm --filter @repo/e2e run test:e2e:react-native:ios || e2e_rc=$?
          # Validate the PACKED @wdio/react-native-service tarball against THIS booted simulator +
          # Metro, reusing the prebuilt WDA. test-package.ts installs it into the isolated fixture,
          # whose own devDeps provide appium + the xcuitest driver (Appium detects drivers from
          # node_modules). The fixture config reads RN_IOS_UDID + RN_WDA_DD (already exported) to pin
          # the sim and reuse the WDA. Gated to the new-arch leg so it runs once per service
          # (packaging is arch-independent).
          smoke_rc=0
          if [ "${{ inputs.new-arch }}" = "true" ]; then
            RN_PLATFORM=ios pnpm test:package:react-native || smoke_rc=$?
          fi
          if [ "$e2e_rc" != 0 ] || [ "$smoke_rc" != 0 ]; then exit 1; fi

      # The failing session-create (#359) leaves no app/page-source, so the appium debug log is the
      # primary evidence. Surface its tail inline (the session error is near the end) for a quick
      # read without downloading the artifact; the full log ships in Upload Test Logs below.
      - name: 🐛 Show Appium log on failure
        if: failure()
        shell: bash
        run: find e2e/logs -name 'wdio-appium.log' -exec sh -c 'echo "===== $1 ====="; tail -n 400 "$1"' _ {} \; || true

      - name: 📦 Upload Test Logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs-react-native-ios-${{ inputs.new-arch && 'new' || 'old' }}-arch-${{ inputs.os }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.test-type }}
          path: |
            e2e/logs/**/*.log
          retention-days: 30
          if-no-files-found: warn
