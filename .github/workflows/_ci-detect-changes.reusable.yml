name: Detect Affected Services (Reusable)

# Convention-driven change detection (issue #331): dorny/paths-filter is used ONLY
# to resolve the changed-file list (its base-ref handling across pull_request and
# push events is battle-tested); all classification lives in
# scripts/detect-changes.mjs, which derives the service list from packages/*-service
# and classifies by the repo's naming conventions. Adding a service needs NO edits
# here — only ci.yml jobs and the per-service reusable workflows.
#
# The classifier is plain node (no install step) and unit-tested via
# `pnpm test:scripts` (wired into the unconditional lint job).

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      force_all:
        description: 'Run all tests (ignore change detection)'
        required: false
        type: boolean
        default: false
    outputs:
      run_electron:
        description: 'Whether to run Electron-related tests and builds'
        value: ${{ jobs.detect.outputs.run_electron }}
      run_tauri:
        description: 'Whether to run Tauri-related tests and builds'
        value: ${{ jobs.detect.outputs.run_tauri }}
      run_dioxus:
        description: 'Whether to run Dioxus-related tests and builds'
        value: ${{ jobs.detect.outputs.run_dioxus }}
      run_electrobun:
        description: 'Whether to run Electrobun-related tests and builds'
        value: ${{ jobs.detect.outputs.run_electrobun }}
      runs:
        description: 'JSON map of service → boolean. New services appear here automatically; consume via fromJSON without adding static outputs.'
        value: ${{ jobs.detect.outputs.runs }}
      has_shared_changes:
        description: 'Whether shared packages changed (affects all services)'
        value: ${{ jobs.detect.outputs.has_shared_changes }}
      run_lint_only:
        description: 'Whether to run only lint (no service-affecting changes detected)'
        value: ${{ jobs.detect.outputs.run_lint_only }}

jobs:
  detect:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      run_electron: ${{ steps.classify.outputs.run_electron || 'false' }}
      run_tauri: ${{ steps.classify.outputs.run_tauri || 'false' }}
      run_dioxus: ${{ steps.classify.outputs.run_dioxus || 'false' }}
      run_electrobun: ${{ steps.classify.outputs.run_electrobun || 'false' }}
      runs: ${{ steps.classify.outputs.runs || '{}' }}
      has_shared_changes: ${{ steps.classify.outputs.has_shared_changes || 'false' }}
      run_lint_only: ${{ steps.classify.outputs.run_lint_only || 'false' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: List Changed Files
        id: changes
        uses: dorny/paths-filter@v4
        with:
          list-files: json
          filters: |
            any:
              - '**'

      - name: Classify Changes
        id: classify
        env:
          CHANGED_FILES: ${{ steps.changes.outputs.any_files }}
          FORCE_ALL: ${{ inputs.force_all }}
        run: node scripts/detect-changes.mjs
