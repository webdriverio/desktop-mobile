name: CrabNebula Mirror Run

# Phase 2 keyed run, dispatched by crabnebula-mirror.yml against a fresh per-dispatch internal branch
# crabnebula-verify/pr-<N>-<run-id> (reviewed fork head squash-merged onto main). It builds and runs
# the macOS CrabNebula E2E with the key, then reports the result back to the fork PR and deletes the
# mirror branch.
#
# This runs untrusted fork code, but only CN_API_KEY reaches it: the build jobs are called with no
# secrets, and the E2E job is passed CN_API_KEY alone (step-scoped by the reusable to the CrabNebula
# step), so TURBO_TOKEN and the deploy key never touch fork code. The real control is still the human
# review — this only executes a decision already made.
#
# A commit status is ultimately writable by any write-access user via the REST API, so this gate is a
# process control among trusted maintainers, not a hard boundary — see the security doc.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'Fork PR number to report back to'
        required: true
        type: string
      sha:
        description: 'Reviewed fork head SHA the result attaches to'
        required: true
        type: string

permissions:
  contents: write
  statuses: write
  pull-requests: write

# One keyed run per PR: a re-dispatch cancels an in-flight run so the latest reviewed head reports. A
# cancelled run posts nothing and deletes nothing (its report is gated on !cancelled()), and each run
# has its own immutable branch, so overlapping runs never interfere.
concurrency:
  group: crabnebula-mirror-run-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  # Only the gated mirror bot (dispatched via crabnebula-mirror.yml) or an allowlisted login may
  # drive a keyed run — a direct workflow_dispatch by any other write-access user is refused here.
  # Unset CRABNEBULA_LABELERS falls back to [] → fail closed (only the bot); see crabnebula-verify.yml.
  authorize:
    if: github.actor == 'github-actions[bot]' || contains(fromJSON(vars.CRABNEBULA_LABELERS || '[]'), github.actor)
    runs-on: ubuntu-latest
    steps:
      - run: echo "Authorized dispatch by ${{ github.actor }}"

  build:
    needs: [authorize]
    uses: ./.github/workflows/_ci-build.reusable.yml
    with:
      os: 'ubuntu-latest'

  build-app:
    needs: [authorize]
    uses: ./.github/workflows/_ci-build-tauri-e2e-app.reusable.yml
    with:
      os: 'macos-latest'

  # Runs every macOS Tauri test-type (matching internal CI), all providers (official auto-skips;
  # embedded is the immune baseline; CrabNebula is the leg under test). require_crabnebula makes a
  # skipped CrabNebula leg (e.g. CN_API_KEY missing) a failure, not a false pass.
  e2e:
    needs: [build, build-app]
    strategy:
      fail-fast: false
      matrix:
        test-type: ['standard', 'window', 'multiremote', 'standalone', 'deeplink']
    uses: ./.github/workflows/_ci-e2e-tauri-all-providers.reusable.yml
    secrets:
      CN_API_KEY: ${{ secrets.CN_API_KEY }}
    with:
      os: 'macos-latest'
      node-version: '24'
      test-type: ${{ matrix.test-type }}
      require_crabnebula: true
      # No interactive debug session on a runner that ran fork code with the key.
      enable_debug: false
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}
      tauri_cache_key: ${{ needs.build-app.outputs.cache_key }}

  # Only an authorized run reports + cleans up, so an unauthorized dispatch can't grief a victim PR's
  # label/branch. !cancelled() (not always()) so a run superseded by a re-dispatch stays silent rather
  # than posting a status that races the surviving run's. Orphans from a cancelled/failed-authorize run
  # are swept by crabnebula-reap.yml.
  report:
    needs: [authorize, e2e]
    if: ${{ !cancelled() && needs.authorize.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report result to the PR and clean up
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
          BR: ${{ github.ref_name }}
          RESULT: ${{ needs.e2e.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The run covers all test-types and both macOS providers (embedded + CrabNebula), so a
          # failure isn't necessarily the CrabNebula leg — point to the run rather than misattribute.
          if [ "$RESULT" = "success" ]; then
            state=success; icon='✅'; desc="macOS CrabNebula verification passed on the reviewed commit."
          elif [ "$RESULT" = "skipped" ]; then
            state=failure; icon='❌'; desc="macOS CrabNebula verification could not run (build failed) — see the run."
          else
            state=failure; icon='❌'; desc="macOS CrabNebula verification failed — see the run for which leg."
          fi
          # Retry the terminal status: a transient failure must not silently strand the SHA at pending.
          posted=false
          for _ in 1 2 3; do
            if gh api "repos/$REPO/statuses/$SHA" -f state="$state" -f context='CrabNebula / macOS' \
              -f description="$desc" -f target_url="$RUN_URL"; then posted=true; break; fi
            sleep 5
          done
          gh api "repos/$REPO/issues/$PR/comments" -f body="$icon macOS CrabNebula verification $RESULT for \`${SHA:0:7}\`. [Run details]($RUN_URL)." || true
          # Clean up only once the terminal status is safely posted. If the post failed, the required
          # check is still pending, so KEEP the branch (and label) as recovery state — re-running this
          # report job retries the post against the same SHA — and go red so it's visible; the reaper
          # backstops the branch if the run is abandoned. Deleting on a failed post would strand the
          # check at pending with nothing to retry from.
          if [ "$posted" = true ]; then
            gh api "repos/$REPO/issues/$PR/labels/crabnebula%3Arun" -X DELETE || true
            gh api "repos/$REPO/git/refs/heads/${BR}" -X DELETE || true
          else
            echo "::error::Failed to post terminal status after retries — kept the branch/label to retry."
            exit 1
          fi
