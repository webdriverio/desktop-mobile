name: CrabNebula Mirror Run

# Phase 2 keyed run, dispatched by crabnebula-mirror.yml against the internal crabnebula-verify/pr-<N>
# branch (reviewed fork head merged onto main). It builds and runs the macOS CrabNebula E2E with the
# key, then reports the result back to the fork PR and deletes the mirror branch.
#
# This runs untrusted fork code, but only CN_API_KEY reaches it: the build jobs are called with no
# secrets, and the E2E job is passed CN_API_KEY alone (step-scoped by the reusable to the CrabNebula
# step), so TURBO_TOKEN and the deploy key never touch fork code. The real control is still the human
# review — this only executes a decision already made.
#
# A commit status is ultimately writable by any write-access user via the REST API, so this gate is a
# process control among trusted maintainers, not a hard boundary. `authorize` still restricts who can
# drive this workflow to the mirror bot or a CRABNEBULA_LABELERS login; see the security doc.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'Fork PR number to report back to'
        required: true
        type: string
      sha:
        description: 'Reviewed fork head SHA the result attaches to'
        required: true
        type: string

permissions:
  contents: write
  statuses: write
  pull-requests: write

env:
  AUTHORIZED_LABELERS: ${{ vars.CRABNEBULA_LABELERS || '["goosewobbler"]' }}

jobs:
  # Only the gated mirror bot (dispatched via crabnebula-mirror.yml) or an allowlisted login may
  # drive a keyed run — a direct workflow_dispatch by any other write-access user is refused here.
  authorize:
    if: github.actor == 'github-actions[bot]' || contains(fromJSON(vars.CRABNEBULA_LABELERS || '["goosewobbler"]'), github.actor)
    runs-on: ubuntu-latest
    steps:
      - run: echo "Authorized dispatch by ${{ github.actor }}"

  build:
    needs: [authorize]
    uses: ./.github/workflows/_ci-build.reusable.yml
    with:
      os: 'ubuntu-latest'

  build-app:
    needs: [authorize]
    uses: ./.github/workflows/_ci-build-tauri-e2e-app.reusable.yml
    with:
      os: 'macos-latest'

  # Runs the macOS providers (official auto-skips; embedded is the immune baseline; CrabNebula is
  # the leg under test). The reusable's Check Provider Results gates on CrabNebula passing.
  e2e:
    needs: [build, build-app]
    uses: ./.github/workflows/_ci-e2e-tauri-all-providers.reusable.yml
    secrets:
      CN_API_KEY: ${{ secrets.CN_API_KEY }}
    with:
      os: 'macos-latest'
      node-version: '24'
      test-type: 'standard'
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}
      tauri_cache_key: ${{ needs.build-app.outputs.cache_key }}

  report:
    needs: [authorize, e2e]
    if: always() && needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Report result to the PR and clean up
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
          RESULT: ${{ needs.e2e.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$RESULT" = "success" ]; then
            state=success; icon='✅'; desc="macOS CrabNebula passed on the reviewed commit."
          elif [ "$RESULT" = "skipped" ]; then
            state=failure; icon='❌'; desc="macOS CrabNebula could not run (build failed) — see the run."
          else
            state=failure; icon='❌'; desc="macOS CrabNebula failed on the reviewed commit — see the run."
          fi
          gh api "repos/$REPO/statuses/$SHA" -f state="$state" -f context='CrabNebula / macOS' \
            -f description="$desc" -f target_url="$RUN_URL"
          gh api "repos/$REPO/issues/$PR/comments" -f body="$icon macOS CrabNebula verification $RESULT for \`${SHA:0:7}\`. [Run details]($RUN_URL)." || true
          # The success status posted above is authoritative — the gate is event-driven and never
          # reverts it (it only re-posts on new-code events). A re-run must be re-authorized, so drop
          # the trigger label and the throwaway branch.
          gh api "repos/$REPO/issues/$PR/labels/crabnebula%3Arun" -X DELETE || true
          gh api "repos/$REPO/git/refs/heads/crabnebula-verify/pr-${PR}" -X DELETE || true
