name: Fork Risk Scan

# Static supply-chain risk scan on every fork PR — its findings inform the maintainer review. Runs NO
# PR code: the scanner is the trusted base-branch copy and reads the fork's files via the GitHub API.
# Findings go to the private Security tab, not a public status, so a prober learns nothing. See CONTRIBUTING.md.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  security-events: write
  statuses: write
  pull-requests: read

env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}

concurrency:
  group: fork-risk-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    if: github.event.pull_request.head.repo.fork == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base (trusted scanner)
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run static risk scan
        id: scan
        env:
          PR: ${{ github.event.pull_request.number }}
          SARIF_OUT: fork-risk-scan.sarif
        run: node scripts/fork-risk-scan.ts

      - name: Upload SARIF to Code Scanning
        id: sarif
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: fork-risk-scan.sarif
          category: fork-risk
          # Avoid a race on refs/pull/N/merge (recomputed async) — upload against the stable PR head.
          sha: ${{ github.event.pull_request.head.sha }}
          ref: refs/pull/${{ github.event.pull_request.number }}/head

      # success() || failure(), not always(): a scan error still posts, but a superseded (cancelled) run doesn't.
      - name: Post terse public status
        if: success() || failure()
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          SARIF_OUTCOME: ${{ steps.sarif.outcome }}
          FINDINGS: ${{ steps.scan.outputs.findings }}
          HIGH: ${{ steps.scan.outputs.high }}
        run: |
          if [ "$SCAN_OUTCOME" != "success" ]; then
            state=error; desc="Risk scan errored — review the run."
          elif [ "$SARIF_OUTCOME" != "success" ]; then
            state=error; desc="${FINDINGS} item(s) flagged, but SARIF upload failed — detail unavailable. Review the run."
          elif [ "${HIGH:-0}" -gt 0 ]; then
            state=failure; desc="${HIGH} high-risk item(s) of ${FINDINGS} — review the Security tab before verifying."
          else
            state=success; desc="${FINDINGS} item(s) flagged (${HIGH} high). Details restricted to maintainers (Security tab)."
          fi
          gh api "repos/$REPO/statuses/$SHA" -f state="$state" -f context='Fork Risk Scan' \
            -f description="$desc" -f target_url="$PR_URL"
