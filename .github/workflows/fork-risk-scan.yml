name: Fork Risk Scan

# Static supply-chain risk scan for every fork PR, feeding the human review before any secret-bearing
# verification (e.g. the CrabNebula flow). Runs NO PR code: the scanner is the trusted base-branch
# copy and reads the fork's files from git objects, so nothing from the PR head runs or lands on disk.
#
# pull_request_target is required — a fork pull_request token is read-only and cannot upload SARIF or
# post a status — and is safe only because no PR code runs. Findings go to the private Security tab
# (Code Scanning), not a public comment, so a prober gets no detection oracle.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  security-events: write
  statuses: write
  pull-requests: read # the scanner reads the PR's files/metadata via the pulls API

concurrency:
  group: fork-risk-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    # Fork PRs only — supply-chain risk is an external-contributor concern; internal PRs are trusted.
    if: github.event.pull_request.head.repo.fork == true
    runs-on: ubuntu-latest
    steps:
      # Checkout only gives us the trusted scanner (scripts/fork-risk-scan.ts). The scan reads the
      # PR's files + diffs from the GitHub API — it never fetches or checks out fork code.
      - name: Checkout base (trusted scanner)
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run static risk scan
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SARIF_OUT: fork-risk-scan.sarif
        run: node scripts/fork-risk-scan.ts

      # Code scanning wants sha to be the tip of ref. Prefer the merge commit on refs/pull/N/merge; if
      # the PR is unmergeable, fall back to the PR head so the Security tab is still populated.
      - name: Resolve upload target (merge commit, else PR head)
        id: mergesha
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # merge_commit_sha is computed asynchronously and is often null right after `opened`; poll
          # briefly so we don't fall back to head just because mergeability wasn't ready yet.
          sha=""
          for _ in 1 2 3 4 5; do
            sha="$(gh api "repos/$REPO/pulls/$PR" --jq '.merge_commit_sha // empty' 2>/dev/null || true)"
            [ -n "$sha" ] && break
            sleep 5
          done
          if [ -n "$sha" ]; then
            { echo "sha=$sha"; echo "ref=refs/pull/$PR/merge"; } >> "$GITHUB_OUTPUT"
          else
            # Unmergeable (e.g. conflicts with main): upload against the PR head instead of skipping, so
            # the per-finding detail lands in the Security tab — a conflicting diff is exactly when the
            # reviewer needs it. head.sha is the tip of refs/pull/N/head, so the pairing is valid.
            { echo "sha=$HEAD_SHA"; echo "ref=refs/pull/$PR/head"; echo "fallback=true"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Upload SARIF to Code Scanning
        id: sarif
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: fork-risk-scan.sarif
          category: fork-risk
          sha: ${{ steps.mergesha.outputs.sha }}
          ref: ${{ steps.mergesha.outputs.ref }}

      # Post on success or failure so a scan error still surfaces (with a note if the SARIF upload
      # failed); skip on cancellation so a superseded run doesn't post a spurious "errored" status.
      - name: Post terse public status
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          SARIF_OUTCOME: ${{ steps.sarif.outcome }}
          FALLBACK: ${{ steps.mergesha.outputs.fallback }}
          FINDINGS: ${{ steps.scan.outputs.findings }}
          HIGH: ${{ steps.scan.outputs.high }}
        run: |
          # Note when the detail was uploaded against the PR head because the PR isn't mergeable.
          suffix=""
          [ "$FALLBACK" = "true" ] && suffix=" (scanned against PR head — not mergeable)"
          if [ "$SCAN_OUTCOME" != "success" ]; then
            gh api "repos/$REPO/statuses/$SHA" -f state=error -f context='Fork Risk Scan' \
              -f description="Risk scan errored — review the run." -f target_url="$PR_URL"
          elif [ "$SARIF_OUTCOME" != "success" ]; then
            gh api "repos/$REPO/statuses/$SHA" -f state=error -f context='Fork Risk Scan' \
              -f description="${FINDINGS} item(s) flagged, but SARIF upload failed — detail unavailable. Review the run." \
              -f target_url="$PR_URL"
          elif [ "${HIGH:-0}" -gt 0 ]; then
            # High-severity findings show a red (non-blocking) check so they aren't skimmed past as green.
            gh api "repos/$REPO/statuses/$SHA" -f state=failure -f context='Fork Risk Scan' \
              -f description="${HIGH} high-risk item(s) of ${FINDINGS} — review the Security tab before verifying.${suffix}" \
              -f target_url="$PR_URL"
          else
            gh api "repos/$REPO/statuses/$SHA" -f state=success -f context='Fork Risk Scan' \
              -f description="${FINDINGS} item(s) flagged (${HIGH} high). Details restricted to maintainers (Security tab).${suffix}" \
              -f target_url="$PR_URL"
          fi
