name: Fork Risk Scan

# Static supply-chain risk scan on every fork PR — its findings inform the maintainer review. Runs NO
# PR code: the scanner is the trusted base-branch copy and reads the fork's files via the GitHub API.
# Findings go to the private Security tab, not a public status, so a prober learns nothing. See CONTRIBUTING.md.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  security-events: write
  statuses: write
  pull-requests: read

env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}

concurrency:
  group: fork-risk-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    if: github.event.pull_request.head.repo.fork == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base (trusted scanner)
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run static risk scan
        id: scan
        env:
          PR: ${{ github.event.pull_request.number }}
          SARIF_OUT: fork-risk-scan.sarif
        run: node scripts/fork-risk-scan.ts

      # upload-sarif needs sha to be the tip of ref: prefer the merge commit, fall back to PR head if unmergeable.
      - name: Resolve upload target (merge commit, else PR head)
        id: mergesha
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # merge_commit_sha is computed async (often null just after opened); poll before falling back to head.
          sha=""
          for _ in 1 2 3 4 5; do
            sha="$(gh api "repos/$REPO/pulls/$PR" --jq '.merge_commit_sha // empty' 2>/dev/null || true)"
            [ -n "$sha" ] && break
            sleep 5
          done
          if [ -n "$sha" ]; then
            { echo "sha=$sha"; echo "ref=refs/pull/$PR/merge"; } >> "$GITHUB_OUTPUT"
          else
            # Unmergeable: pair head.sha with refs/pull/N/head — a valid tip/ref for the upload.
            { echo "sha=$HEAD_SHA"; echo "ref=refs/pull/$PR/head"; echo "fallback=true"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Upload SARIF to Code Scanning
        id: sarif
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: fork-risk-scan.sarif
          category: fork-risk
          sha: ${{ steps.mergesha.outputs.sha }}
          ref: ${{ steps.mergesha.outputs.ref }}

      # success() || failure(), not always(): a scan error still posts, but a superseded (cancelled) run doesn't.
      - name: Post terse public status
        if: success() || failure()
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          SARIF_OUTCOME: ${{ steps.sarif.outcome }}
          FALLBACK: ${{ steps.mergesha.outputs.fallback }}
          FINDINGS: ${{ steps.scan.outputs.findings }}
          HIGH: ${{ steps.scan.outputs.high }}
        run: |
          suffix=""
          [ "$FALLBACK" = "true" ] && suffix=" (scanned against PR head — not mergeable)"
          if [ "$SCAN_OUTCOME" != "success" ]; then
            state=error; desc="Risk scan errored — review the run."
          elif [ "$SARIF_OUTCOME" != "success" ]; then
            state=error; desc="${FINDINGS} item(s) flagged, but SARIF upload failed — detail unavailable. Review the run."
          elif [ "${HIGH:-0}" -gt 0 ]; then
            state=failure; desc="${HIGH} high-risk item(s) of ${FINDINGS} — review the Security tab before verifying.${suffix}"
          else
            state=success; desc="${FINDINGS} item(s) flagged (${HIGH} high). Details restricted to maintainers (Security tab).${suffix}"
          fi
          gh api "repos/$REPO/statuses/$SHA" -f state="$state" -f context='Fork Risk Scan' \
            -f description="$desc" -f target_url="$PR_URL"
