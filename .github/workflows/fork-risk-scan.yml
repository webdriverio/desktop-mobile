name: Fork Risk Scan

# Static supply-chain risk scan for every fork PR, feeding the human review before any secret-bearing
# verification (e.g. the CrabNebula flow). Runs NO PR code: the scanner is the trusted base-branch
# copy and reads the fork's files from git objects, so nothing from the PR head runs or lands on disk.
#
# pull_request_target is required — a fork pull_request token is read-only and cannot upload SARIF or
# post a status — and is safe only because no PR code runs. Findings go to the private Security tab
# (Code Scanning), not a public comment, so a prober gets no detection oracle.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  security-events: write
  statuses: write

concurrency:
  group: fork-risk-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    # Fork PRs only — supply-chain risk is an external-contributor concern; internal PRs are trusted.
    if: github.event.pull_request.head.repo.fork == true
    runs-on: ubuntu-latest
    steps:
      # Default pull_request_target checkout is the BASE branch — the trusted scanner, not the
      # fork's copy. Do not change the ref.
      - name: Checkout base (trusted scanner)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Fetch the PR head as objects only (no checkout, no execution) so the scanner can diff
      # base...head and read head blobs via `git show`.
      - name: Fetch PR head objects
        env:
          PR: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "pull/${PR}/head"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run static risk scan
        id: scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SARIF_OUT: fork-risk-scan.sarif
        run: node scripts/fork-risk-scan.ts

      # continue-on-error: a missing Code Scanning setup must not fail the scan.
      - name: Upload SARIF to Code Scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: fork-risk-scan.sarif
          category: fork-risk
          sha: ${{ github.event.pull_request.head.sha }}
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      - name: Post terse public status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          FINDINGS: ${{ steps.scan.outputs.findings }}
          HIGH: ${{ steps.scan.outputs.high }}
        run: |
          gh api "repos/$REPO/statuses/$SHA" \
            -f state=success \
            -f context='Fork Risk Scan' \
            -f description="${FINDINGS} item(s) flagged (${HIGH} high). Details restricted to maintainers (Security tab)." \
            -f target_url="$PR_URL"
