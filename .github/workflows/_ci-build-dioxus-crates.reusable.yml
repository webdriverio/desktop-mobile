name: Build Dioxus Crates (Reusable)

permissions:
  contents: read

# Verifies the Dioxus crates compile and their unit tests pass.

on:
  workflow_call:
    inputs:
      os:
        description: 'Operating system to run on'
        required: false
        type: string
        default: 'ubuntu-latest'

jobs:
  build:
    name: Cargo check + test
    runs-on: ${{ inputs.os }}
    timeout-minutes: 45
    env:
      # One target dir for all three crates, which build the same dioxus-desktop stack.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        shell: bash
        run: rustup update stable && rustup default stable

      - name: Cache Cargo registry + target dirs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-dioxus-${{ hashFiles('packages/dioxus-bridge/Cargo.toml', 'packages/dioxus-driver/Cargo.toml', 'packages/dioxus-embedded-driver/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-dioxus-

      - name: Install Linux WebKit + Dioxus runtime deps
        if: runner.os == 'Linux'
        # libxdo-dev is required because dioxus-desktop transitively links
        # libxdo (via global-hotkey / tray-icon / muda) for X11 keyboard
        # automation on Linux. Without it the bridge crate test binary
        # fails to link with `unable to find library -lxdo`.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            libayatana-appindicator3-dev

      # Build the guest-js bundle so the bridge crate's build.rs can embed it.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install workspace deps
        run: pnpm install --frozen-lockfile --filter @wdio/dioxus-bridge
      - name: Build dioxus-bridge guest-js
        run: pnpm --filter @wdio/dioxus-bridge build

      # The bridge crate embeds dist-js/index.js (build.rs + include_str!) and
      # it is committed to git so downstream git/crates.io consumers receive a
      # working bridge. Rebuilding from guest-js/index.ts above must not change
      # it — a diff here means the committed bundle is stale and consumers would
      # get out-of-date (or, on a clean regen, broken) injection.
      - name: Verify committed guest-js bundle is up to date
        shell: bash
        run: |
          if ! git diff --exit-code -- packages/dioxus-bridge/dist-js/index.js; then
            echo "::error file=packages/dioxus-bridge/dist-js/index.js::Committed guest-js bundle is stale. Run 'pnpm --filter @wdio/dioxus-bridge build' and commit packages/dioxus-bridge/dist-js/index.js."
            exit 1
          fi

      - name: cargo check (wdio-dioxus-bridge)
        run: cargo check
        working-directory: packages/dioxus-bridge

      - name: cargo test (wdio-dioxus-bridge)
        run: cargo test
        working-directory: packages/dioxus-bridge

      - name: cargo check (wdio-dioxus-driver)
        run: cargo check
        working-directory: packages/dioxus-driver

      - name: cargo test (wdio-dioxus-embedded-driver)
        run: cargo test
        working-directory: packages/dioxus-embedded-driver
