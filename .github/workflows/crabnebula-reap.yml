name: CrabNebula Reap Stale Branches

# Sweeps throwaway crabnebula-verify/pr-<N>-<run-id> mirror branches (created by crabnebula-mirror.yml) that a
# cancelled or non-reporting keyed run left behind. Verifications finish in minutes, so anything older
# than a day is stale. This makes the mirror-run's own cleanup non-critical: orphans are reaped here.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read # the active-run guard queries the actions/runs API before deleting a branch

jobs:
  reap:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale crabnebula-verify/* branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # A mirror branch's tip is a merge/pin commit created at mirror time, so its committer date is
          # the branch's creation time — the age we cut on. --paginate so more than one page (30) of
          # orphans is still swept.
          cutoff=$(date -u -d '1 day ago' +%s)
          gh api --paginate "repos/$REPO/git/matching-refs/heads/crabnebula-verify/" --jq '.[].ref' | while read -r ref; do
            br="${ref#refs/heads/}"
            d=$(gh api "repos/$REPO/commits/$br" --jq '.commit.committer.date' 2>/dev/null) || continue
            ts=$(date -u -d "$d" +%s 2>/dev/null) || continue
            if [ "$ts" -lt "$cutoff" ]; then
              # Belt-and-braces for a rare multi-hour runner backlog: never delete a ref a keyed run
              # still needs for checkout. Let gh build+encode the query (-X GET -f) so the slashed
              # branch matches head_branch exactly — a manual %2F risks a double-encode or raw mismatch.
              # Any run not yet 'completed' still needs the branch (queued/in_progress and transitional
              # states), rather than enumerating active ones.
              # Fail CLOSED: if the query itself errors, keep the branch this pass rather than delete one
              # a run may still need (a stale branch is cheaper than a broken checkout); next run retries.
              if active=$(gh api -X GET "repos/$REPO/actions/runs" -f "branch=$br" -f "per_page=100" \
                --jq '[.workflow_runs[] | select(.status != "completed")] | length' 2>/dev/null); then
                if [ "${active:-0}" -gt 0 ]; then
                  echo "Skipping $br — $active active run(s) still reference it"
                  continue
                fi
              else
                echo "Skipping $br — could not query active runs (API error); retrying next run"
                continue
              fi
              echo "Reaping $br (last commit $d)"
              gh api -X DELETE "repos/$REPO/git/refs/heads/$br" || true
            fi
          done
