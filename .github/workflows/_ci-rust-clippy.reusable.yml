name: Rust Clippy (Reusable)

permissions:
  contents: read

# Lints first-party Rust crates with clippy, then tests those listed in `test-crates`.
# Crates listed in `generated-permissions-crates` must also commit and package their generated permission files.

on:
  workflow_call:
    inputs:
      os:
        description: 'Operating system to run on'
        required: false
        type: string
        default: 'ubuntu-latest'
      crates:
        description: 'Newline-separated crate directories to lint (also used as the rust-cache workspaces)'
        required: true
        type: string
      test-crates:
        description: 'Newline-separated crate directories to test'
        required: false
        type: string
        default: ''
      generated-permissions-crates:
        description: 'Newline-separated Tauri plugin crate directories whose generated permission files are checked'
        required: false
        type: string
        default: ''

jobs:
  clippy:
    name: cargo clippy
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    steps:
      - name: 👷 Checkout Repository
        uses: actions/checkout@v7

      - name: 🦀 Install Rust toolchain
        shell: bash
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy

      - name: 🦀 Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.crates }}
          cache-on-failure: true
          # ~/.cargo/bin/ can carry over stale binaries (e.g. rustup-init in
          # place of cargo) across runs on macOS, breaking the toolchain.
          cache-bin: false

      - name: 🦀 Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        # webkit2gtk/soup/javascriptcoregtk back the Linux webview for both the
        # tauri plugin and the dioxus crates. libxdo is a hard link dependency
        # dioxus-desktop picks up transitively (via muda/tray-icon) for X11
        # keyboard automation.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            libayatana-appindicator3-dev

      - name: 🔍 Run clippy
        shell: bash
        env:
          CRATES: ${{ inputs.crates }}
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r crate; do
            [ -n "$crate" ] || continue
            echo "::group::cargo clippy ($crate)"
            if ! cargo clippy --manifest-path "$crate/Cargo.toml" --all-targets -- -D warnings; then
              echo "::error file=$crate/Cargo.toml::clippy failed for $crate"
              status=1
            fi
            echo "::endgroup::"
          done <<< "$CRATES"
          exit "$status"

      - name: 🧪 Run tests
        if: inputs.test-crates != ''
        shell: bash
        env:
          CRATES: ${{ inputs.test-crates }}
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r crate; do
            [ -n "$crate" ] || continue
            echo "::group::cargo test ($crate)"
            if ! cargo test --manifest-path "$crate/Cargo.toml"; then
              echo "::error file=$crate/Cargo.toml::cargo test failed for $crate"
              status=1
            fi
            echo "::endgroup::"
          done <<< "$CRATES"
          exit "$status"

      # Ensures autogenerated files are committed and current, to avoid failures in a read-only vendored source tree.
      - name: 📦 Check generated permissions are committed and packaged
        if: ${{ !cancelled() && inputs.generated-permissions-crates != '' }}
        shell: bash
        env:
          CRATES: ${{ inputs.generated-permissions-crates }}
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r crate; do
            [ -n "$crate" ] || continue
            echo "::group::generated permissions ($crate)"
            # Delete first so the check can't pass on files the build script never rewrote.
            rm -rf "$crate/permissions/autogenerated"
            if ! cargo check --manifest-path "$crate/Cargo.toml"; then
              echo "::error file=$crate/Cargo.toml::cargo check failed for $crate"
              status=1
            else
              changes=$(git status --short --untracked-files=all -- "$crate/permissions")
              if [ -n "$changes" ]; then
                echo "$changes"
                git diff -- "$crate/permissions"
                fix="delete $crate/permissions/autogenerated, rebuild, and commit the result, including deletions"
                echo "::error file=$crate/Cargo.toml::$crate/permissions differs from what build.rs generates; $fix"
                status=1
              fi
            fi
            committed=$(git -C "$crate" ls-files -- permissions/autogenerated | LC_ALL=C sort)
            if ! grep -q '^permissions/autogenerated/' <<< "$committed"; then
              echo "::error file=$crate/Cargo.toml::no committed files under $crate/permissions/autogenerated"
              status=1
            # --allow-dirty: the build above may leave the tree dirty, and only the file list matters here.
            elif ! packaged=$(cargo package --manifest-path "$crate/Cargo.toml" --list --allow-dirty); then
              echo "::error file=$crate/Cargo.toml::cargo package --list failed for $crate"
              status=1
            else
              missing=$(LC_ALL=C comm -23 <(echo "$committed") <(LC_ALL=C sort <<< "$packaged"))
              if [ -n "$missing" ]; then
                echo "Committed but not packaged:"
                echo "$missing"
                missing_list=$(paste -sd ' ' - <<< "$missing")
                echo "::error file=$crate/Cargo.toml::the packaged $crate crate is missing: $missing_list"
                status=1
              fi
            fi
            echo "::endgroup::"
          done <<< "$CRATES"
          exit "$status"
