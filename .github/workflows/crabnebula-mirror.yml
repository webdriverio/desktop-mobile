name: CrabNebula Mirror Dispatch

# Phase 2 of docs/security/crabnebula-fork-verification.md. When an authorized reviewer applies
# `crabnebula:run` to a fork PR (after reviewing the diff), this mirrors the reviewed fork head —
# merged onto main so the internal workflows are present — to a fresh, immutable per-dispatch branch
# crabnebula-verify/pr-<N>-<run-id> and dispatches the keyed run. This job runs NO fork code — only
# file-level git operations and a push.
#
# The authorization is enforced here in the job `if`, not just by crabnebula-verify.yml removing the
# label, because label removal races the mirror. GitHub has no per-label permission, so the allowlist
# is the real boundary.

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: write
  statuses: write
  pull-requests: write
  actions: write

concurrency:
  group: crabnebula-mirror-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # Fallback default kept in sync with crabnebula-verify.yml / crabnebula-mirror-run.yml;
  # CRABNEBULA_LABELERS is authoritative.
  mirror:
    if: >-
      github.event.label.name == 'crabnebula:run' &&
      github.event.pull_request.head.repo.fork == true &&
      contains(fromJSON(vars.CRABNEBULA_LABELERS || '["goosewobbler"]'), github.event.sender.login)
    runs-on: ubuntu-latest
    steps:
      # Default pull_request_target checkout is the trusted BASE (main). Do not check out fork code.
      - name: Checkout base
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mirror reviewed fork head onto an internal branch
        id: mirror
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin "pull/${PR}/head"
          # If the PR head moved since the label event, the reviewed SHA is stale (a push raced the
          # label) — refuse rather than run/attest unreviewed code. Narrows, but can't fully close, the
          # label-race window; see the security doc.
          if [ "$(git rev-parse FETCH_HEAD)" != "$HEAD_SHA" ]; then
            echo "moved=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # One immutable branch per dispatch (run-id suffix): a re-apply never force-pushes over a
          # branch an earlier run is still using, so no run can test a revision other than the one it
          # reports. This run's report step deletes it; the reaper sweeps any orphan.
          BR="crabnebula-verify/pr-${PR}-${GITHUB_RUN_ID}"
          git checkout -B "$BR" origin/main
          # Squash-merge (single parent = main), not a real merge: a 2-parent merge commit would carry
          # the fork's ancestor commits as pushed objects, and if any of them edited .github/workflows
          # the GITHUB_TOKEN push is rejected (no workflows scope) even when the tip's .github matches
          # main. A squash pushes just one commit off main; we still pin its .github to main, so the push
          # has no workflow change and the keyed run resolves CI machinery from main, not the fork.
          if ! git merge --squash "$HEAD_SHA"; then
            git reset --hard >/dev/null 2>&1 || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # rm before checkout so fork-ADDED workflow files (not in main) are removed, not just overwritten.
          rm -rf .github
          git checkout origin/main -- .github
          git add -A
          git commit -m 'Mirror reviewed fork head onto main for CrabNebula verification' >/dev/null
          # Guard the push: if it fails, set -e would abort here and skip the report step (implicit
          # success()), leaving the label wedged. Handle it so the report step can clean up.
          if ! git push origin "$BR"; then
            echo "pushfail=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "branch=$BR" >> "$GITHUB_OUTPUT"

      # always() + mirror.outcome == 'failure' so an aborted git op (fetch/checkout under set -e, which
      # sets no marker) still cleans up rather than wedging the label. The explicit markers give a
      # precise message; any other failure gets a generic one.
      - name: Report and stop (head moved, conflict, or setup failure)
        if: >-
          always() &&
          (steps.mirror.outputs.conflict == 'true' || steps.mirror.outputs.moved == 'true' ||
           steps.mirror.outputs.pushfail == 'true' || steps.mirror.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          MOVED: ${{ steps.mirror.outputs.moved }}
          PUSHFAIL: ${{ steps.mirror.outputs.pushfail }}
          CONFLICT: ${{ steps.mirror.outputs.conflict }}
        run: |
          if [ "$MOVED" = "true" ]; then
            desc='Cannot verify: the PR head moved since the label. Re-review, then re-apply crabnebula:run.'
          elif [ "$PUSHFAIL" = "true" ]; then
            desc='Cannot verify: could not create the verification branch. Re-apply crabnebula:run to retry.'
          elif [ "$CONFLICT" = "true" ]; then
            desc='Cannot verify: PR conflicts with main. Rebase, then re-apply crabnebula:run.'
          else
            desc='Cannot verify: the mirror step failed to set up. Re-apply crabnebula:run to retry.'
          fi
          gh api "repos/$REPO/statuses/$SHA" -f state=failure -f context='CrabNebula / macOS' \
            -f description="$desc" -f target_url="$PR_URL" || true
          # Remove the label so a re-apply fires a fresh labeled event (re-adding a present label does not).
          gh api "repos/$REPO/issues/$PR/labels/crabnebula%3Arun" -X DELETE || true

      - name: Dispatch keyed run and mark pending
        if: steps.mirror.outputs.conflict != 'true' && steps.mirror.outputs.moved != 'true' && steps.mirror.outputs.pushfail != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          BR: ${{ steps.mirror.outputs.branch }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # If the dispatch fails the run never starts, and its report job never runs — so clean up the
          # branch, drop the label (so a re-apply fires a fresh event), and post a failure status here.
          if ! gh workflow run crabnebula-mirror-run.yml --ref "$BR" -f pr="$PR" -f sha="$SHA"; then
            gh api "repos/$REPO/git/refs/heads/${BR}" -X DELETE || true
            gh api "repos/$REPO/issues/$PR/labels/crabnebula%3Arun" -X DELETE || true
            gh api "repos/$REPO/statuses/$SHA" -f state=failure -f context='CrabNebula / macOS' \
              -f description='Could not start the keyed verification — re-apply crabnebula:run to retry.' \
              -f target_url="$PR_URL" || true
            echo "::error::Failed to dispatch the keyed run; cleaned up $BR and the label."
            exit 1
          fi
          gh api "repos/$REPO/statuses/$SHA" -f state=pending -f context='CrabNebula / macOS' \
            -f description='Keyed macOS CrabNebula run dispatched on the reviewed commit.' \
            -f target_url="$PR_URL"
          gh api "repos/$REPO/issues/$PR/comments" -f body="🔑 macOS CrabNebula verification dispatched for \`${SHA:0:7}\` on \`${BR}\`. Result will post back as the \`CrabNebula / macOS\` check." || true
          # Drop the label now that the run is dispatched: the keyed run no longer needs it (it carries
          # pr/sha inputs), and if that run is cancelled before its report job the label won't wedge.
          # A re-apply then fires a fresh labeled event to retry.
          gh api "repos/$REPO/issues/$PR/labels/crabnebula%3Arun" -X DELETE || true
