name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**/*.md'
  pull_request:
    # Doc-only PRs still trigger CI but use lint-only mode via detect-changes
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Run all tests (ignore change detection)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # Detect which services are affected by changes
  detect-changes:
    uses: ./.github/workflows/_ci-detect-changes.reusable.yml
    with:
      force_all: ${{ inputs.force_all || false }}

  # Build on Linux first since it's the fastest and its artifacts are used by all other jobs
  # Skip build when only docs changed
  build:
    name: Build [Linux]
    needs: [detect-changes]
    if: needs.detect-changes.outputs.run_lint_only != 'true'
    uses: ./.github/workflows/_ci-build.reusable.yml
    secrets: inherit
    with:
      os: 'ubuntu-latest'

  # Run linting - doesn't need build artifacts
  lint:
    name: Lint [Linux]
    needs: [detect-changes]
    uses: ./.github/workflows/_ci-lint.reusable.yml
    secrets: inherit

  # Run unit tests - skip when only docs changed
  unit-matrix:
    name: Unit [${{ matrix.display-name }}]
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.run_lint_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            display-name: Linux
          - os: windows-latest
            display-name: Windows
          - os: macos-latest
            display-name: macOS-ARM
          - os: macos-15-intel
            display-name: macOS-Intel
    uses: ./.github/workflows/_ci-unit.reusable.yml
    secrets: inherit
    with:
      os: ${{ matrix.os }}
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}

  # Build Tauri E2E app binaries - only if Tauri tests will run
  build-tauri-e2e-app-linux:
    name: Build Tauri E2E App [Linux]
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.run_tauri == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    uses: ./.github/workflows/_ci-build-tauri-e2e-app.reusable.yml
    secrets: inherit
    with:
      os: 'ubuntu-latest'
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}

  build-tauri-e2e-app-windows:
    name: Build Tauri E2E App [Windows]
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.run_tauri == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    uses: ./.github/workflows/_ci-build-tauri-e2e-app.reusable.yml
    secrets: inherit
    with:
      os: 'windows-latest'
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}

  build-tauri-e2e-app-macos-arm:
    name: Build Tauri E2E App [macOS-ARM]
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.run_tauri == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    uses: ./.github/workflows/_ci-build-tauri-e2e-app.reusable.yml
    secrets: inherit
    with:
      os: 'macos-latest'
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}

  # Build Dioxus Rust crates - only if Dioxus tests will run.
  # v1 scope: Linux only. wdio-dioxus-driver is Windows-targeted but
  # cargo check on Linux still validates the dependency graph and platform-
  # neutral code paths. Cross-platform verification lands in PR3.
  build-dioxus-crates-linux:
    name: Build Dioxus Crates [Linux]
    needs: [detect-changes]
    if: needs.detect-changes.outputs.run_dioxus == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    uses: ./.github/workflows/_ci-build-dioxus-crates.reusable.yml
    secrets: inherit
    with:
      os: 'ubuntu-latest'

  # Build Dioxus E2E app binaries - only if Dioxus tests will run
  build-dioxus-e2e-app-linux:
    name: Build Dioxus E2E App [Linux]
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.run_dioxus == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    uses: ./.github/workflows/_ci-build-dioxus-e2e-app.reusable.yml
    secrets: inherit
    with:
      os: 'ubuntu-latest'
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}

  build-dioxus-e2e-app-windows:
    name: Build Dioxus E2E App [Windows]
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.run_dioxus == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    uses: ./.github/workflows/_ci-build-dioxus-e2e-app.reusable.yml
    secrets: inherit
    with:
      os: 'windows-latest'
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}

  build-dioxus-e2e-app-macos-arm:
    name: Build Dioxus E2E App [macOS-ARM]
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.run_dioxus == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    uses: ./.github/workflows/_ci-build-dioxus-e2e-app.reusable.yml
    secrets: inherit
    with:
      os: 'macos-latest'
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}

  # ────────────────────────────────────────────────────────────────────────
  # Electrobun E2E app (CEF bundle, no Rust crates). The CEF fixture build is
  # the biggest unknown in this pipeline: a beta Bun/CEF toolchain that pulls a
  # ~150MB CEF download. macOS is the validated platform.
  #
  # macOS-ONLY in 0.x (pre-1.0): Linux/Windows build + e2e are NOT run. They build
  # fine, but their CEF can't recover from the chrome-runtime persist:default
  # profile failure (the global-context fallback serves no /json), so the e2e can't
  # attach — an upstream electrobun limitation (see the agent-os plan "Framework
  # gaps"). Re-add the Linux/Windows build + e2e jobs once that lands upstream (#320).
  # ────────────────────────────────────────────────────────────────────────
  build-electrobun-e2e-app-macos-arm:
    name: Build Electrobun E2E App [macOS-ARM]
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.run_electrobun == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    uses: ./.github/workflows/_ci-build-electrobun-e2e-app.reusable.yml
    secrets: inherit
    with:
      os: 'macos-latest'
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}

  # ────────────────────────────────────────────────────────────────────────
  # Electrobun E2E app [Windows] — built with the native WebView2 renderer
  # (bundleCEF:false → no CEF download). The service injects --remote-debugging-port via
  # WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS and attaches over CDP (msedgedriver), no upstream
  # dependency. Gating (in ci-status.needs), alongside the macOS CEF build.
  # ────────────────────────────────────────────────────────────────────────
  build-electrobun-e2e-app-windows:
    name: Build Electrobun E2E App [Windows]
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.run_electrobun == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    uses: ./.github/workflows/_ci-build-electrobun-e2e-app.reusable.yml
    secrets: inherit
    with:
      os: 'windows-latest'
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}

  # macOS (CEF) + Windows (WebView2). The package-test fixture build mirrors the e2e build
  # (Bun, tar artifact); Windows builds the native WebView2 renderer (no CEF download).
  build-electrobun-package-app-macos-arm:
    name: Build Electrobun Package Test App [macOS-ARM]
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.run_electrobun == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    uses: ./.github/workflows/_ci-build-electrobun-package-app.reusable.yml
    secrets: inherit
    with:
      os: 'macos-latest'
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}

  build-electrobun-package-app-windows:
    name: Build Electrobun Package Test App [Windows]
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.run_electrobun == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    uses: ./.github/workflows/_ci-build-electrobun-package-app.reusable.yml
    secrets: inherit
    with:
      os: 'windows-latest'
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}

  # Build Dioxus package test apps - only if Dioxus package tests will run
  build-dioxus-package-app-linux:
    name: Build Dioxus Package Test App [Linux]
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.run_dioxus == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    uses: ./.github/workflows/_ci-build-dioxus-package-app.reusable.yml
    secrets: inherit
    with:
      os: 'ubuntu-latest'
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}

  build-dioxus-package-app-windows:
    name: Build Dioxus Package Test App [Windows]
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.run_dioxus == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    uses: ./.github/workflows/_ci-build-dioxus-package-app.reusable.yml
    secrets: inherit
    with:
      os: 'windows-latest'
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}

  build-dioxus-package-app-macos-arm:
    name: Build Dioxus Package Test App [macOS-ARM]
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.run_dioxus == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    uses: ./.github/workflows/_ci-build-dioxus-package-app.reusable.yml
    secrets: inherit
    with:
      os: 'macos-latest'
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}

  build-dioxus-package-app-macos-intel:
    name: Build Dioxus Package Test App [macOS-Intel]
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.run_dioxus == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    uses: ./.github/workflows/_ci-build-dioxus-package-app.reusable.yml
    secrets: inherit
    with:
      os: 'macos-15-intel'
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}

  build-dioxus-package-app-linux-arm:
    name: Build Dioxus Package Test App [Linux-ARM64]
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.run_dioxus == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    uses: ./.github/workflows/_ci-build-dioxus-package-app.reusable.yml
    secrets: inherit
    with:
      os: 'ubuntu-24.04-arm'
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}

  # Build Tauri package test apps - only if Tauri package tests will run
  build-tauri-package-app-linux:
    name: Build Tauri Package Test App [Linux]
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.run_tauri == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    uses: ./.github/workflows/_ci-build-tauri-package-app.reusable.yml
    secrets: inherit
    with:
      os: 'ubuntu-latest'
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}

  build-tauri-package-app-windows:
    name: Build Tauri Package Test App [Windows]
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.run_tauri == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    uses: ./.github/workflows/_ci-build-tauri-package-app.reusable.yml
    secrets: inherit
    with:
      os: 'windows-latest'
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}

  build-tauri-package-app-linux-arm:
    name: Build Tauri Package Test App [Linux-ARM64]
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.run_tauri == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    uses: ./.github/workflows/_ci-build-tauri-package-app.reusable.yml
    secrets: inherit
    with:
      os: 'ubuntu-24.04-arm'
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}

  build-tauri-package-app-macos-arm:
    name: Build Tauri Package Test App [macOS-ARM]
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.run_tauri == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    uses: ./.github/workflows/_ci-build-tauri-package-app.reusable.yml
    secrets: inherit
    with:
      os: 'macos-latest'
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}

  build-tauri-package-app-macos-intel:
    name: Build Tauri Package Test App [macOS-Intel]
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.run_tauri == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    uses: ./.github/workflows/_ci-build-tauri-package-app.reusable.yml
    secrets: inherit
    with:
      os: 'macos-15-intel'
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}

  # Run package tests after unit tests to ensure the package is built correctly
  # Split Electron and Tauri tests across separate jobs for better parallelization and clarity
  # Electron apps are built inline on the test runner (faster builds, Turbo caching handles it)
  # Tauri apps are built separately due to longer build times and system dependencies
  # Electron package tests are split by module type (CJS/ESM) for better error isolation
  package-electron-matrix:
    name: Package - Electron [${{ matrix.display-name }}] - ${{ matrix.module-type }}
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.run_electron == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            display-name: Linux
            module-type: cjs
          - os: ubuntu-latest
            display-name: Linux
            module-type: esm
          - os: windows-latest
            display-name: Windows
            module-type: cjs
          - os: windows-latest
            display-name: Windows
            module-type: esm
          - os: macos-latest
            display-name: macOS-ARM
            module-type: cjs
          - os: macos-latest
            display-name: macOS-ARM
            module-type: esm
          - os: macos-15-intel
            display-name: macOS-Intel
            module-type: cjs
          - os: macos-15-intel
            display-name: macOS-Intel
            module-type: esm
    uses: ./.github/workflows/_ci-package.reusable.yml
    secrets: inherit
    with:
      os: ${{ matrix.os }}
      service: 'electron'
      module-type: ${{ matrix.module-type }}
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}

  package-tauri-linux:
    name: Package - Tauri [Linux]
    needs: [detect-changes, build, build-tauri-package-app-linux]
    if: needs.detect-changes.outputs.run_tauri == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    uses: ./.github/workflows/_ci-package.reusable.yml
    secrets: inherit
    with:
      os: 'ubuntu-latest'
      service: 'tauri'
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}
      tauri_cache_key: ${{ needs.build-tauri-package-app-linux.outputs.cache_key }}

  package-tauri-windows:
    name: Package - Tauri [Windows]
    needs: [detect-changes, build, build-tauri-package-app-windows]
    if: needs.detect-changes.outputs.run_tauri == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    uses: ./.github/workflows/_ci-package.reusable.yml
    secrets: inherit
    with:
      os: 'windows-latest'
      service: 'tauri'
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}
      tauri_cache_key: ${{ needs.build-tauri-package-app-windows.outputs.cache_key }}

  package-tauri-linux-arm:
    name: Package - Tauri [Linux-ARM64]
    needs: [detect-changes, build, build-tauri-package-app-linux-arm]
    if: needs.detect-changes.outputs.run_tauri == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    uses: ./.github/workflows/_ci-package.reusable.yml
    secrets: inherit
    with:
      os: 'ubuntu-24.04-arm'
      service: 'tauri'
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}
      tauri_cache_key: ${{ needs.build-tauri-package-app-linux-arm.outputs.cache_key }}

  package-tauri-macos-arm:
    name: Package - Tauri [macOS-ARM]
    needs: [detect-changes, build, build-tauri-package-app-macos-arm]
    if: needs.detect-changes.outputs.run_tauri == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    uses: ./.github/workflows/_ci-package.reusable.yml
    secrets: inherit
    with:
      os: 'macos-latest'
      service: 'tauri'
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}
      tauri_cache_key: ${{ needs.build-tauri-package-app-macos-arm.outputs.cache_key }}

  package-tauri-macos-intel:
    name: Package - Tauri [macOS-Intel]
    needs: [detect-changes, build, build-tauri-package-app-macos-intel]
    if: needs.detect-changes.outputs.run_tauri == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    uses: ./.github/workflows/_ci-package.reusable.yml
    secrets: inherit
    with:
      os: 'macos-15-intel'
      service: 'tauri'
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}
      tauri_cache_key: ${{ needs.build-tauri-package-app-macos-intel.outputs.cache_key }}

  # Run Tauri package tests across different Linux distributions using Docker
  # Tests cross-distro compatibility, tauri-driver auto-installation, and WebKitWebDriver detection
  # Excluded distributions:
  # - SUSE: No official WebKitWebDriver package (requires multi-hour source build)
  # - Alpine: musl/static linking incompatible with GTK/webkit (no static libraries available)
  # - CentOS Stream 9: glib 2.68 too old (Tauri requires >= 2.70)
  # - CentOS Stream 10: WebKitGTK removed by Red Hat due to 200+ CVEs and unsustainable maintenance
  package-tauri-distros:
    name: Package - Tauri (Docker) [${{ matrix.display-name }}]
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.run_tauri == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            display-name: Ubuntu
          - distro: fedora
            display-name: Fedora
          - distro: debian
            display-name: Debian
          - distro: arch
            display-name: Arch
          - distro: void
            display-name: Void
    uses: ./.github/workflows/_ci-package-docker-tauri.reusable.yml
    secrets: inherit
    with:
      distro: ${{ matrix.distro }}

  # Run build tests outside of the main Linux build job
  build-matrix:
    name: Build [${{ matrix.display-name }}]
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.run_electron == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            display-name: Windows
          - os: macos-latest
            display-name: macOS-ARM
          - os: macos-15-intel
            display-name: macOS-Intel
    uses: ./.github/workflows/_ci-build.reusable.yml
    secrets: inherit
    with:
      os: ${{ matrix.os }}

  # E2E test matrix strategy:
  # - Run tests across operating systems and architectures (Linux, Windows, macOS ARM)
  # - macOS Intel is only covered by package tests; the runtime path is
  #   arch-agnostic enough that paying for Intel E2Es isn't worth it
  # - Test 3 scenarios (builder, forge, script)
  # - E2E tests use ESM only (CJS/ESM testing is done in package tests)
  # - Optimize for GitHub Actions concurrency limits
  e2e-matrix:
    name: E2E - Electron [${{ matrix.display-name }}] - ${{ matrix.scenario }}
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.run_electron == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            display-name: Linux
            scenario: builder
          - os: ubuntu-latest
            display-name: Linux
            scenario: forge
          - os: ubuntu-latest
            display-name: Linux
            scenario: script
          - os: windows-latest
            display-name: Windows
            scenario: builder
          - os: windows-latest
            display-name: Windows
            scenario: forge
          - os: windows-latest
            display-name: Windows
            scenario: script
          - os: macos-latest
            display-name: macOS-ARM
            scenario: builder
          - os: macos-latest
            display-name: macOS-ARM
            scenario: forge
          - os: macos-latest
            display-name: macOS-ARM
            scenario: script
    uses: ./.github/workflows/_ci-e2e-electron.reusable.yml
    secrets: inherit
    with:
      os: ${{ matrix.os }}
      node-version: '24'
      scenario: ${{ matrix.scenario }}
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}

  # Electron window tests - run on Linux with splash screen enabled
  e2e-electron-window:
    name: E2E - Electron [${{ matrix.display-name }}] (window) - ${{ matrix.scenario }}
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.run_electron == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            display-name: Linux
            scenario: builder
          - os: ubuntu-latest
            display-name: Linux
            scenario: forge
          - os: ubuntu-latest
            display-name: Linux
            scenario: script
    uses: ./.github/workflows/_ci-e2e-electron.reusable.yml
    secrets: inherit
    with:
      os: ${{ matrix.os }}
      node-version: '24'
      scenario: ${{ matrix.scenario }}
      variant: window
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}

  # Tauri E2E tests - all providers (official, embedded, CrabNebula) run sequentially per runner
  # This consolidation reduces runner count from 56 to 20 for Tauri E2E tests
  # Official provider is automatically skipped on macOS (WKWebView limitations)
  e2e-tauri-linux:
    name: E2E - Tauri [Linux] - ${{ matrix.test-type }}
    needs: [detect-changes, build, build-tauri-e2e-app-linux]
    if: needs.detect-changes.outputs.run_tauri == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        test-type: ['standard', 'window', 'multiremote', 'standalone', 'deeplink']
    uses: ./.github/workflows/_ci-e2e-tauri-all-providers.reusable.yml
    secrets: inherit
    with:
      os: 'ubuntu-latest'
      node-version: '24'
      test-type: ${{ matrix.test-type }}
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}
      tauri_cache_key: ${{ needs.build-tauri-e2e-app-linux.outputs.cache_key }}

  e2e-tauri-windows:
    name: E2E - Tauri [Windows] - ${{ matrix.test-type }}
    needs: [detect-changes, build, build-tauri-e2e-app-windows]
    if: needs.detect-changes.outputs.run_tauri == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        test-type: ['standard', 'window', 'multiremote', 'standalone', 'deeplink']
    uses: ./.github/workflows/_ci-e2e-tauri-all-providers.reusable.yml
    secrets: inherit
    with:
      os: 'windows-latest'
      node-version: '24'
      test-type: ${{ matrix.test-type }}
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}
      tauri_cache_key: ${{ needs.build-tauri-e2e-app-windows.outputs.cache_key }}

  e2e-tauri-macos-arm:
    name: E2E - Tauri [macOS-ARM] - ${{ matrix.test-type }}
    needs: [detect-changes, build, build-tauri-e2e-app-macos-arm]
    if: needs.detect-changes.outputs.run_tauri == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        test-type: ['standard', 'window', 'multiremote', 'standalone', 'deeplink']
    uses: ./.github/workflows/_ci-e2e-tauri-all-providers.reusable.yml
    secrets: inherit
    with:
      os: 'macos-latest'
      node-version: '24'
      test-type: ${{ matrix.test-type }}
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}
      tauri_cache_key: ${{ needs.build-tauri-e2e-app-macos-arm.outputs.cache_key }}

  # Dioxus E2E tests - embedded provider (all platforms) + external provider (Windows only in v1)
  # All providers run sequentially per runner; external provider auto-skips on Linux/macOS
  e2e-dioxus-linux:
    name: E2E - Dioxus [Linux] - ${{ matrix.test-type }}
    needs: [detect-changes, build, build-dioxus-e2e-app-linux]
    if: needs.detect-changes.outputs.run_dioxus == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        test-type: ['standard', 'window', 'multiremote', 'standalone', 'deeplink']
    uses: ./.github/workflows/_ci-e2e-dioxus-all-providers.reusable.yml
    secrets: inherit
    with:
      os: 'ubuntu-latest'
      node-version: '24'
      test-type: ${{ matrix.test-type }}
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}
      dioxus_cache_key: ${{ needs.build-dioxus-e2e-app-linux.outputs.cache_key }}

  e2e-dioxus-windows:
    name: E2E - Dioxus [Windows] - ${{ matrix.test-type }}
    needs: [detect-changes, build, build-dioxus-e2e-app-windows]
    if: needs.detect-changes.outputs.run_dioxus == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        test-type: ['standard', 'window', 'multiremote', 'standalone', 'deeplink']
    uses: ./.github/workflows/_ci-e2e-dioxus-all-providers.reusable.yml
    secrets: inherit
    with:
      os: 'windows-latest'
      node-version: '24'
      test-type: ${{ matrix.test-type }}
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}
      dioxus_cache_key: ${{ needs.build-dioxus-e2e-app-windows.outputs.cache_key }}

  e2e-dioxus-macos-arm:
    name: E2E - Dioxus [macOS-ARM] - ${{ matrix.test-type }}
    needs: [detect-changes, build, build-dioxus-e2e-app-macos-arm]
    if: needs.detect-changes.outputs.run_dioxus == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        test-type: ['standard', 'window', 'multiremote', 'standalone', 'deeplink']
    uses: ./.github/workflows/_ci-e2e-dioxus-all-providers.reusable.yml
    secrets: inherit
    with:
      os: 'macos-latest'
      node-version: '24'
      test-type: ${{ matrix.test-type }}
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}
      dioxus_cache_key: ${{ needs.build-dioxus-e2e-app-macos-arm.outputs.cache_key }}

  # ────────────────────────────────────────────────────────────────────────
  # Electrobun E2E tests (single CDP-attach provider — no provider matrix).
  #
  # macOS-ONLY in 0.x (pre-1.0): only the macOS-ARM leg runs. Linux/Windows e2e are
  # NOT run — their CEF can't recover from the persist:default profile failure (no
  # /json), an upstream electrobun limitation (see the agent-os plan "Framework
  # gaps"). Re-add a Linux/Windows leg (+ its build job above) once that lands (#320).
  #
  # Test-type matrix: 'standard' (api/application/execute/logging/mock),
  # 'window' (two CEF views), 'deeplink' (macOS-only; auto-skips elsewhere).
  # ────────────────────────────────────────────────────────────────────────
  # REQUIRED gate (listed in ci-status.needs): the `standard` SINGLE-WINDOW suite
  # (api/application/execute/logging/mock). The window (multi-window) and deeplink
  # suites are intentionally NOT run on CI: they hit an upstream CEF per-instance
  # profile-isolation limitation — BrowserWindow forces a `persist:default` partition
  # the chrome-runtime can't create as a non-global profile, so multi-window/relaunch
  # fall back to a racy global context, and a shared user-data-dir folds instances →
  # no CDP targets. Not fixable from the fixture/service, and multiremote is blocked
  # for the same reason. See the agent-os plan "Framework gaps" + the skip notes in
  # window.spec.ts / deeplink.spec.ts. Re-add these (and a multiremote leg) once
  # electrobun ships per-window partitions / per-instance root_cache_path / open-url
  # routing (#320). The specs stay runnable locally via TEST_TYPE=window|deeplink.
  e2e-electrobun-macos-arm:
    name: E2E - Electrobun [macOS-ARM] - ${{ matrix.test-type }}
    needs: [detect-changes, build, build-electrobun-e2e-app-macos-arm]
    if: needs.detect-changes.outputs.run_electrobun == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        test-type: ['standard']
    uses: ./.github/workflows/_ci-e2e-electrobun-all-providers.reusable.yml
    secrets: inherit
    with:
      os: 'macos-latest'
      node-version: '24'
      test-type: ${{ matrix.test-type }}
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}

  # ────────────────────────────────────────────────────────────────────────
  # Electrobun E2E [Windows] — WebView2 over CDP (msedgedriver, classic WebDriver). Runs
  # `standard`, `window` (multi-window), and `multiremote` (two isolated WebView2 instances in
  # one worker — each its own process + LOCALAPPDATA data dir) — all capabilities CEF lacks, so
  # they run on Windows where CEF is local-only / single-instance. Gating (in ci-status.needs).
  # ────────────────────────────────────────────────────────────────────────
  e2e-electrobun-windows:
    name: E2E - Electrobun [Windows] - ${{ matrix.test-type }}
    needs: [detect-changes, build, build-electrobun-e2e-app-windows]
    if: needs.detect-changes.outputs.run_electrobun == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        test-type: ['standard', 'window', 'multiremote']
    uses: ./.github/workflows/_ci-e2e-electrobun-all-providers.reusable.yml
    secrets: inherit
    with:
      os: 'windows-latest'
      node-version: '24'
      test-type: ${{ matrix.test-type }}
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}


  # Dioxus package tests - all platforms (mirrors E2E coverage)
  package-dioxus-linux:
    name: Package - Dioxus [Linux]
    needs: [detect-changes, build, build-dioxus-package-app-linux]
    if: needs.detect-changes.outputs.run_dioxus == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    uses: ./.github/workflows/_ci-package.reusable.yml
    secrets: inherit
    with:
      os: 'ubuntu-latest'
      service: 'dioxus'
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}
      dioxus_cache_key: ${{ needs.build-dioxus-package-app-linux.outputs.cache_key }}

  package-dioxus-windows:
    name: Package - Dioxus [Windows]
    needs: [detect-changes, build, build-dioxus-package-app-windows]
    if: needs.detect-changes.outputs.run_dioxus == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    uses: ./.github/workflows/_ci-package.reusable.yml
    secrets: inherit
    with:
      os: 'windows-latest'
      service: 'dioxus'
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}
      dioxus_cache_key: ${{ needs.build-dioxus-package-app-windows.outputs.cache_key }}

  package-dioxus-macos-arm:
    name: Package - Dioxus [macOS-ARM]
    needs: [detect-changes, build, build-dioxus-package-app-macos-arm]
    if: needs.detect-changes.outputs.run_dioxus == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    uses: ./.github/workflows/_ci-package.reusable.yml
    secrets: inherit
    with:
      os: 'macos-latest'
      service: 'dioxus'
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}
      dioxus_cache_key: ${{ needs.build-dioxus-package-app-macos-arm.outputs.cache_key }}

  package-dioxus-macos-intel:
    name: Package - Dioxus [macOS-Intel]
    needs: [detect-changes, build, build-dioxus-package-app-macos-intel]
    if: needs.detect-changes.outputs.run_dioxus == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    uses: ./.github/workflows/_ci-package.reusable.yml
    secrets: inherit
    with:
      os: 'macos-15-intel'
      service: 'dioxus'
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}
      dioxus_cache_key: ${{ needs.build-dioxus-package-app-macos-intel.outputs.cache_key }}

  package-dioxus-linux-arm:
    name: Package - Dioxus [Linux-ARM64]
    needs: [detect-changes, build, build-dioxus-package-app-linux-arm]
    if: needs.detect-changes.outputs.run_dioxus == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    uses: ./.github/workflows/_ci-package.reusable.yml
    secrets: inherit
    with:
      os: 'ubuntu-24.04-arm'
      service: 'dioxus'
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}
      dioxus_cache_key: ${{ needs.build-dioxus-package-app-linux-arm.outputs.cache_key }}

  # Run Dioxus package tests across different Linux distributions using Docker.
  # Dioxus desktop renders through Wry → WebKitGTK (the same system WebView as
  # Tauri), so each distro's WebKitGTK version is exercised against the app build
  # and the in-process 'embedded' driver. Unlike Tauri there is NO system
  # WebKitWebDriver to detect — the driver is compiled into the app — so this
  # matrix validates build + headless launch + bridge protocol, not driver
  # discovery. Same distro exclusions as package-tauri-distros apply.
  package-dioxus-distros:
    name: Package - Dioxus (Docker) [${{ matrix.display-name }}]
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.run_dioxus == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            display-name: Ubuntu
          - distro: fedora
            display-name: Fedora
          - distro: debian
            display-name: Debian
          - distro: arch
            display-name: Arch
          - distro: void
            display-name: Void
    uses: ./.github/workflows/_ci-package-docker-dioxus.reusable.yml
    secrets: inherit
    with:
      distro: ${{ matrix.distro }}

  # Electrobun package test — macOS (CEF) + Windows (WebView2). The fixture bundle is
  # downloaded by artifact name within the run (tar/symlinks), so no cache_key is threaded.
  package-electrobun-macos-arm:
    name: Package - Electrobun [macOS-ARM]
    needs: [detect-changes, build, build-electrobun-package-app-macos-arm]
    if: needs.detect-changes.outputs.run_electrobun == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    uses: ./.github/workflows/_ci-package.reusable.yml
    secrets: inherit
    with:
      os: 'macos-latest'
      service: 'electrobun'
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}

  package-electrobun-windows:
    name: Package - Electrobun [Windows]
    needs: [detect-changes, build, build-electrobun-package-app-windows]
    if: needs.detect-changes.outputs.run_electrobun == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    uses: ./.github/workflows/_ci-package.reusable.yml
    secrets: inherit
    with:
      os: 'windows-latest'
      service: 'electrobun'
      build_id: ${{ needs.build.outputs.build_id }}
      artifact_size: ${{ needs.build.outputs.artifact_size }}
      cache_key: ${{ needs.build.outputs.cache_key }}

  # Universal binary verification - Electron only
  package-electron-mac-universal:
    name: Package - Electron [macOS-Universal-Verify]
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.run_electron == 'true' && needs.detect-changes.outputs.run_lint_only != 'true'
    runs-on: macos-latest
    steps:
      - name: 👷 Checkout Repository
        uses: actions/checkout@v6

      - name: 🛠️ Setup Development Environment
        uses: ./.github/workflows/actions/setup-workspace
        with:
          node-version: '24'

      - name: 📦 Download Build Artifacts
        uses: ./.github/workflows/actions/download-archive
        with:
          name: wdio-desktop-mobile
          path: wdio-desktop-mobile-build
          filename: artifact.zip
          cache_key_prefix: wdio-desktop-build
          exact_cache_key: ${{ needs.build.outputs.cache_key || github.run_id && format('{0}-{1}-{2}-{3}{4}', 'Linux', 'wdio-desktop-build', 'wdio-desktop-mobile', github.run_id, github.run_attempt > 1 && format('-rerun{0}', github.run_attempt) || '') || '' }}

      - name: 🔨 Build Universal Binary (Electron Builder)
        run: pnpm --filter electron-builder-e2e-app build:mac-universal

      - name: ✅ Verify Universal Binary Contains Both Architectures (Builder)
        run: |
          BINARY_PATH="fixtures/e2e-apps/electron-builder/dist-electron/mac-universal/electron-builder-e2e-app.app/Contents/MacOS/electron-builder-e2e-app"

          if [ ! -f "$BINARY_PATH" ]; then
            echo "❌ Binary not found at $BINARY_PATH"
            echo "Contents of dist-electron/mac-universal:"
            ls -la fixtures/e2e-apps/electron-builder/dist-electron/mac-universal/ || echo "Directory does not exist"
            exit 1
          fi

          echo "Binary found, checking architecture..."
          lipo -info "$BINARY_PATH"

          ARCHS=$(lipo -info "$BINARY_PATH" | grep "Architectures" | awk '{print $(NF-1), $NF}')
          echo "Found architectures: $ARCHS"

          if [[ "$ARCHS" != *"x86_64"* ]]; then
            echo "❌ Missing x86_64 architecture"
            exit 1
          fi

          if [[ "$ARCHS" != *"arm64"* ]]; then
            echo "❌ Missing arm64 architecture"
            exit 1
          fi

          echo "✅ Universal binary verified: $ARCHS"

      - name: 🔨 Build Universal Binary (Electron Forge)
        run: pnpm --filter electron-forge-e2e-app build:mac-universal

      - name: ✅ Verify Universal Binary Contains Both Architectures (Forge)
        run: |
          BINARY_PATH="fixtures/e2e-apps/electron-forge/out/electron-forge-e2e-app-darwin-universal/electron-forge-e2e-app.app/Contents/MacOS/electron-forge-e2e-app"

          if [ ! -f "$BINARY_PATH" ]; then
            echo "❌ Binary not found at $BINARY_PATH"
            echo "Contents of out/:"
            ls -la fixtures/e2e-apps/electron-forge/out/ || echo "Directory does not exist"
            exit 1
          fi

          echo "Binary found, checking architecture..."
          lipo -info "$BINARY_PATH"

          ARCHS=$(lipo -info "$BINARY_PATH" | grep "Architectures" | awk '{print $(NF-1), $NF}')
          echo "Found architectures: $ARCHS"

          if [[ "$ARCHS" != *"x86_64"* ]]; then
            echo "❌ Missing x86_64 architecture"
            exit 1
          fi

          if [[ "$ARCHS" != *"arm64"* ]]; then
            echo "❌ Missing arm64 architecture"
            exit 1
          fi

          echo "✅ Universal binary verified: $ARCHS"

  # Single status check gate - use this as the sole required check in branch protection
  # Avoids needing to update branch protection rules when CI jobs are added/removed
  ci-status:
    name: CI Status
    if: always()
    needs:
      - lint
      - unit-matrix
      - e2e-matrix
      - e2e-electron-window
      - e2e-tauri-linux
      - e2e-tauri-windows
      - e2e-tauri-macos-arm
      - e2e-dioxus-linux
      - e2e-dioxus-windows
      - e2e-dioxus-macos-arm
      # Electrobun gates: macOS CEF `standard`, plus Windows WebView2 `standard` + `window`
      # (multi-window works on WebView2 — no persist:default gap, so it runs where CEF is
      # local-only). Linux is not run (CEF serves no /json; native WebKitGTK needs upstream
      # automation). deeplink stays local-only.
      - e2e-electrobun-macos-arm
      - e2e-electrobun-windows
      - package-electron-matrix
      - package-tauri-linux
      - package-tauri-windows
      - package-tauri-linux-arm
      - package-tauri-macos-arm
      - package-tauri-macos-intel
      - package-tauri-distros
      - package-dioxus-linux
      - package-dioxus-windows
      - package-dioxus-macos-arm
      - package-dioxus-macos-intel
      - package-dioxus-linux-arm
      - package-dioxus-distros
      - package-electrobun-macos-arm
      - package-electrobun-windows
      - build-matrix
      - build-dioxus-crates-linux
      - build-tauri-e2e-app-linux
      - build-tauri-e2e-app-windows
      - build-tauri-e2e-app-macos-arm
      - build-tauri-package-app-linux
      - build-tauri-package-app-windows
      - build-tauri-package-app-linux-arm
      - build-dioxus-e2e-app-linux
      - build-dioxus-e2e-app-windows
      - build-dioxus-e2e-app-macos-arm
      - build-electrobun-e2e-app-macos-arm
      - build-electrobun-e2e-app-windows
      - build-electrobun-package-app-macos-arm
      - build-electrobun-package-app-windows
      - build-dioxus-package-app-linux
      - build-dioxus-package-app-windows
      - build-dioxus-package-app-macos-arm
      - build-dioxus-package-app-macos-intel
      - build-dioxus-package-app-linux-arm
      - package-electron-mac-universal
    runs-on: ubuntu-latest
    steps:
      - name: Check CI results
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $results"
          for result in $results; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "CI failed: found job with result '$result'"
              exit 1
            fi
          done
          echo "All CI jobs passed or were skipped"
