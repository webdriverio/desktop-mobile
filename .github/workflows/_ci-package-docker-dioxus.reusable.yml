name: Package (Docker, Dioxus)
# Description: Runs Dioxus package tests in Docker containers across different Linux distributions

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      distro:
        description: 'Linux distribution to test (ubuntu, fedora, debian, arch, void)'
        type: string
        required: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  package-docker:
    name: ${{ inputs.distro }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Development Environment
        uses: ./.github/workflows/actions/setup-workspace
        with:
          node-version: '24'

      - name: Build packages
        run: pnpm turbo run build --filter=@wdio/dioxus-service... --filter=@wdio/dioxus-bridge

      # Pack workspace packages to tarballs so the container only receives pre-built
      # artefacts and does not need the full workspace toolchain (Node >=23.6 .ts
      # execution, Turbo, etc.) -- root cause of the Node-version breakage (#350).
      # Note: dioxus-bridge dist-js is baked into the app binary at cargo-build time
      # via build.rs; its Rust crate stays as a path dep so the JS is still available
      # in the workspace during the container's cargo build step.
      - name: Pack tarballs
        run: |
          mkdir -p dist/tarballs
          for pkg in dioxus-service native-core native-spy native-types native-utils; do
            pnpm pack -C packages/$pkg --pack-destination "$(pwd)/dist/tarballs"
          done
          echo "Packed tarballs:"
          ls -lh dist/tarballs/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run tests using test.sh
        run: |
          cd fixtures/package-tests/dioxus-app/docker
          TARBALLS_DIR="$(pwd)/../../../../dist/tarballs" ./test.sh ${{ inputs.distro }} test

      - name: Copy logs to workspace
        if: always()
        run: |
          # Copy Docker test logs to workspace for upload
          mkdir -p fixtures/package-tests/dioxus-app/logs-docker/
          cp /tmp/docker-test-${{ inputs.distro }}.log fixtures/package-tests/dioxus-app/logs-docker/ 2>/dev/null || true
          # Copy any test logs that were captured
          cp -r /tmp/dioxus-test-logs-${{ inputs.distro }}/* fixtures/package-tests/dioxus-app/logs-docker/ 2>/dev/null || true

      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-results-dioxus-${{ inputs.distro }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: fixtures/package-tests/**/logs-*/
          retention-days: 7
          if-no-files-found: warn
