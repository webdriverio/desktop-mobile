name: Build Tauri Apps
# Description: Builds Tauri test applications and creates shareable artifacts for E2E testing

permissions:
  contents: read

on:
  workflow_call:
    # Make this a reusable workflow, no value needed
    # https://docs.github.com/en/actions/using-workflows/reusing-workflows
    inputs:
      os:
        description: 'OS of runner'
        required: true
        type: string
      build-command:
        description: 'Build command for Tauri apps (build or build:debug)'
        type: string
        default: 'build'
    outputs:
      build_id:
        description: 'Unique identifier for this build'
        value: ${{ jobs.build-tauri-apps.outputs.build_id }}
      build_date:
        description: 'Timestamp when the build completed'
        value: ${{ jobs.build-tauri-apps.outputs.build_date }}
      artifact_size:
        description: 'Size of the build artifact in bytes'
        value: ${{ jobs.build-tauri-apps.outputs.artifact_size }}
      cache_key:
        description: 'Cache key used for artifact uploads, can be passed to download actions'
        value: ${{ jobs.build-tauri-apps.outputs.cache_key }}

env:
  TURBO_TELEMETRY_DISABLED: 1
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # This job builds all Tauri test applications for the specified OS
  # Unlike package builds, each OS creates its own artifacts since binaries are platform-specific
  build-tauri-apps:
    name: Build
    runs-on: ${{ inputs.os }}
    outputs:
      build_id: ${{ steps.build-info.outputs.build_id }}
      build_date: ${{ steps.build-info.outputs.build_date }}
      artifact_size: ${{ steps.upload-archive.outputs.size || '0' }}
      cache_key: ${{ steps.upload-archive.outputs.cache_key }}
    steps:
      # Standard checkout with SSH key for private repositories
      - name: 👷 Checkout Repository
        uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      # Set up Node.js and PNPM using the reusable action
      - name: 🛠️ Setup Development Environment
        uses: ./.github/workflows/actions/setup-workspace
        with:
          node-version: '24.15.0'

      # Install Rust toolchain for Tauri compilation
      - name: 🦀 Install Rust Toolchain
        shell: bash
        run: rustup update stable && rustup default stable

      - name: 🦀 Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            fixtures/e2e-apps/tauri/src-tauri
            fixtures/package-tests/tauri-app/src-tauri
          cache-on-failure: true
          cache-targets: false
          # ~/.cargo/bin/ can carry over stale binaries (e.g. rustup-init in
          # place of cargo) across runs on macOS, breaking the toolchain.
          cache-bin: false

      # Install Tauri dependencies on Linux
      - name: 🔧 Fix ARM64 Package Sources (Linux)
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        shell: bash
        run: |
          echo "Fixing ARM64 package sources for Ubuntu..."
          # Add proper arm64 sources for jammy
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/arm64-jammy.list > /dev/null
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64-jammy.list > /dev/null
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy-backports main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64-jammy.list > /dev/null
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64-jammy.list > /dev/null

          # Ensure default sources only use amd64
          sudo sed -i -e 's/^deb http/deb [arch=amd64] http/' /etc/apt/sources.list
          sudo sed -i -e 's/^deb mirror/deb [arch=amd64] mirror/' /etc/apt/sources.list

          sudo apt-get update

      - name: 🦀 Install Tauri Dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "Installing Tauri dependencies for Linux..."
          # Only add archive.ubuntu.com for amd64, arm64 sources are handled above
          if [ "$(uname -m)" != "aarch64" ]; then
            echo "deb http://archive.ubuntu.com/ubuntu jammy main universe" | sudo tee -a /etc/apt/sources.list > /dev/null
          fi
          sudo apt-get update
          # Install build dependencies only (no runtime libraries needed for compilation)
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libsoup2.4-dev \
            libjavascriptcoregtk-4.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            libasound2-dev \
            libx11-dev \
            libxext-dev \
            libxfixes-dev \
            libxrender-dev \
            libxrandr-dev \
            libxss-dev \
            libxtst-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxdamage-dev \
            libxinerama-dev \
            libxcb1-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-render0-dev \
            libxcb-randr0-dev \
            libxcb-xinerama0-dev \
            libxcb-xkb-dev \
            libxcb-image0-dev \
            libxcb-util0-dev \
            libxcb-icccm4-dev \
            libxcb-ewmh-dev \
            libxcb-dri2-0-dev

      # Generate build information for tracking
      - name: 📊 Generate Build Information
        id: build-info
        shell: bash
        run: |
          echo "build_id=$(date +%s)-${{ github.run_id }}-${{ runner.os }}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"

      # Build all Tauri test applications using Turbo
      # This creates the binaries in src-tauri/target/debug
      # Build both E2E app and package test app
      - name: 🏗️ Build All Tauri Apps
        run: pnpm exec turbo run ${{ inputs.build-command }} --filter=tauri-e2e-app --filter=tauri-app-example --only --parallel
        shell: bash

      # Upload Tauri app binaries as artifacts
      # Each OS uploads its own artifacts since binaries are platform-specific
      # Using GitHub Actions cache with ~90 day retention (vs. 1 day for regular artifacts)
      # Include both E2E app and package test app binaries
      - name: 📦 Upload Tauri App Binaries
        id: upload-archive
        uses: ./.github/workflows/actions/upload-archive
        with:
          name: tauri-apps-${{ runner.os }}
          output: tauri-apps-${{ runner.os }}/artifact.zip
          paths: fixtures/e2e-apps/tauri/src-tauri/target fixtures/package-tests/tauri-app/src-tauri/target
          cache_key_prefix: tauri-apps
          retention_days: '90'
