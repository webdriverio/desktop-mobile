name: 'Setup Development Environment'
description: 'Sets up Node.js environment with PNPM for CI/CD workflows'
inputs:
  node-version:
    description: 'Node.js version to use for the environment (e.g., "24.15.0")'
    required: false
    # Pinned exact: Node 24.16.0 (rolled out in runner image 20260525.x) silently
    # breaks @electron/packager "Finalizing package" cross-platform. Bump when
    # upstream confirms a fix.
    default: '24.15.0'

runs:
  using: composite
  steps:
    # Defender real-time scanning intercepts .exe writes during chromedriver
    # extraction (`@puppeteer/browsers`) and Electron app packaging (Forge /
    # `@electron/packager`) on Windows runners. The writing tool exits 0 but
    # the destination directory ends up missing the executable; downstream
    # checks then fail with "browser folder exists but executable is missing"
    # (chromedriver) or "Could not find Electron app built with Electron
    # Forge!" (Forge). Excluding the temp + runner-temp paths and the test
    # processes addresses both classes of failure at the source.
    - name: 🛡️ Exclude temp paths from Windows Defender
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Add-MpPreference -ExclusionPath "$env:TEMP" -ErrorAction SilentlyContinue
        Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP" -ErrorAction SilentlyContinue
        Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction SilentlyContinue
        Add-MpPreference -ExclusionProcess "node.exe" -ErrorAction SilentlyContinue
        Add-MpPreference -ExclusionProcess "electron.exe" -ErrorAction SilentlyContinue
        Add-MpPreference -ExclusionProcess "chromedriver.exe" -ErrorAction SilentlyContinue
        Add-MpPreference -ExclusionExtension ".exe" -ErrorAction SilentlyContinue

    - name: 🧰 Setup PNPM Package Manager
      uses: pnpm/action-setup@v6
      with:
        run_install: false

    - name: 🛠️ Setup Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        # Temporarily disable cache to ensure fresh tarball is used
        # cache: 'pnpm'
        # cache-dependency-path: '**/pnpm-lock.yaml'

    - name: 📦 Install Project Dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: 🔧 Configure Git Identity
      shell: bash
      run: |
        git config --global user.email "bot@webdriver.io"
        git config --global user.name "WebdriverIO Release Bot"
