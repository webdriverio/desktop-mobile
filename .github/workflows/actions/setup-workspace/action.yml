name: "Setup Development Environment"
description: "Sets up Node.js environment with PNPM for CI/CD workflows"
inputs:
  node-version:
    description: 'Node.js version to use for the environment (e.g., "24")'
    required: false
    default: "24"
  wdio-v9:
    description: "Switch webdriverio and @wdio/* to the minimum catalog (WebdriverIO v9) and, on Linux, start a display for the job"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: 🧰 Setup PNPM Package Manager
      uses: pnpm/action-setup@v6
      with:
        run_install: false

    - name: 🛠️ Setup Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        # The runner's cached Node can predate the packages' engines floor.
        check-latest: true
        # Store cache keyed on the lockfile. Safe w.r.t. the @wdio/utils `file:` tarball
        # override: it is applied only by test-package.ts, inside its isolated sandbox
        # install, so the root lockfile never references the mutable tarball and this
        # cache never sees it.
        cache: "pnpm"
        cache-dependency-path: "**/pnpm-lock.yaml"

    - name: 📦 Install Project Dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: 🔀 Switch to WebdriverIO v9
      if: inputs.wdio-v9 == 'true'
      shell: bash
      run: node scripts/switch-catalog.ts minimum --wdio-only

    # v9 wraps each worker in xvfb-run when DISPLAY is unset, and Ubuntu 26.04's xvfb-run closes its IPC fd.
    # Workaround for webdriverio/webdriverio#15685; drop once v9 is no longer supported.
    - name: 🖥️ Start Xvfb for WebdriverIO v9 (Linux)
      if: inputs.wdio-v9 == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        if ! command -v Xvfb >/dev/null; then
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
        fi
        nohup Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
        for _ in $(seq 1 50); do
          [ -S /tmp/.X11-unix/X99 ] && break
          sleep 0.2
        done
        if [ ! -S /tmp/.X11-unix/X99 ]; then
          cat "$RUNNER_TEMP/xvfb.log"
          echo "::error title=Xvfb did not start::no socket for display :99 after 10s"
          exit 1
        fi
        echo "DISPLAY=:99" >> "$GITHUB_ENV"

    - name: 🔧 Configure Git Identity
      shell: bash
      run: |
        git config --global user.email "bot@webdriver.io"
        git config --global user.name "WebdriverIO Release Bot"
