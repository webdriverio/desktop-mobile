name: 'Setup Development Environment'
description: 'Sets up Node.js environment with PNPM for CI/CD workflows'
inputs:
  node-version:
    description: 'Node.js version to use for the environment (e.g., "24")'
    required: false
    default: '24'

runs:
  using: composite
  steps:
    - name: 🧰 Setup PNPM Package Manager
      uses: pnpm/action-setup@v6
      with:
        run_install: false

    - name: 🛠️ Setup Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        # Store cache keyed on the lockfile. Safe w.r.t. the @wdio/utils `file:` tarball
        # override: it is applied only by test-package.ts, inside its isolated sandbox
        # install, so the root lockfile never references the mutable tarball and this
        # cache never sees it.
        cache: 'pnpm'
        cache-dependency-path: '**/pnpm-lock.yaml'

    - name: 📦 Install Project Dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: 🔧 Configure Git Identity
      shell: bash
      run: |
        git config --global user.email "bot@webdriver.io"
        git config --global user.name "WebdriverIO Release Bot"
