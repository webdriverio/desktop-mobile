name: "Start Xvfb"
description: "Starts one Xvfb on display :99 and sets DISPLAY for the rest of the job (Linux only)"

runs:
  using: composite
  steps:
    # The maintenance WebdriverIO major, v9, starts a display only for its workers, and the Tauri and Dioxus
    # launchers spawn drivers that need one. Drop once v9 is no longer supported.
    - name: 🖥️ Start Xvfb
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if ! command -v Xvfb >/dev/null; then
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
        fi
        nohup Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
        for _ in $(seq 1 50); do
          [ -S /tmp/.X11-unix/X99 ] && break
          sleep 0.2
        done
        if [ ! -S /tmp/.X11-unix/X99 ]; then
          cat "$RUNNER_TEMP/xvfb.log"
          echo "::error title=Xvfb did not start::no socket for display :99 after 10s"
          exit 1
        fi
        echo "DISPLAY=:99" >> "$GITHUB_ENV"
