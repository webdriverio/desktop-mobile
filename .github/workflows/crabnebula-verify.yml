name: CrabNebula macOS Gate

# Closes the fork coverage gap: on a fork PR the macOS CrabNebula E2E leg is skipped (no CN_API_KEY
# for forks), so it could otherwise merge green without ever running. This posts a required
# `CrabNebula / macOS` status that blocks such a PR until it is verified. See
# docs/security/crabnebula-fork-verification.md.
#
# The status is event-driven and never derived from label state: `reset-on-code` (re)posts pending
# on new code, and success is only ever posted by an authorized action — an authorized
# `crabnebula:verified` labeler here, or the keyed mirror run. So an unauthorized or un-removed label
# can never greenlight the gate. GitHub has no per-label permission, hence identity is checked here.
#
# pull_request_target for the writable statuses/labels token; this workflow runs NO PR code
# (detect-changes.ts is the trusted base copy and only classifies a list of changed paths).

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read
  statuses: write
  pull-requests: write

concurrency:
  group: crabnebula-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  # Logins allowed to attest a verification / authorise a keyed run — keep this to the people who do
  # the fork-diff review, NOT all repo admins. Set repo variable CRABNEBULA_LABELERS (a JSON array).
  AUTHORIZED_LABELERS: ${{ vars.CRABNEBULA_LABELERS || '["goosewobbler"]' }}

jobs:
  # (Re)post the required status on new code: pending for a fork PR that touches Tauri, success
  # otherwise, via the real detect-changes.ts classifier so it can't drift from what routes a PR to
  # the Tauri E2E pipeline. A new push also clears stale attestation labels.
  reset-on-code:
    if: contains(fromJSON('["opened","reopened","synchronize"]'), github.event.action)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base (trusted classifier)
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Clear stale attestation labels on new commits
        if: github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          for L in crabnebula:verified crabnebula:run; do
            enc=$(jq -rn --arg l "$L" '$l|@uri')
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/$enc" >/dev/null 2>&1 || true
          done

      - name: Post required status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          # Classify defensively — a transient API/classifier failure must never leave the required
          # check unposted (that strands the PR at "Expected"). On failure, fork PRs fail safe to
          # pending (blocked, recoverable by re-run/push), never a false green.
          files_json="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' 2>/dev/null | jq -R . | jq -s -c . 2>/dev/null || true)"
          run_tauri=""; run_lint_only=""
          if [ -n "$files_json" ]; then
            tmp="$(mktemp)"
            if CHANGED_FILES="$files_json" GITHUB_OUTPUT="$tmp" node scripts/detect-changes.ts >/dev/null 2>&1; then
              run_tauri="$(sed -n 's/^run_tauri=//p' "$tmp")"
              run_lint_only="$(sed -n 's/^run_lint_only=//p' "$tmp")"
            fi
          fi
          state=success
          desc="Not applicable (internal PR or no Tauri changes)."
          if [ "$IS_FORK" = "true" ]; then
            if [ -z "$run_tauri" ]; then
              state=pending
              desc="Gate could not classify changes — re-run the job or push to retry."
            elif [ "$run_tauri" = "true" ] && [ "$run_lint_only" != "true" ]; then
              state=pending
              desc="Blocked: macOS CrabNebula skipped on this fork. Review, verify, then add crabnebula:verified."
            fi
          fi
          echo "fork=$IS_FORK run_tauri=$run_tauri run_lint_only=$run_lint_only -> $state"
          gh api "repos/$REPO/statuses/$SHA" \
            -f state="$state" \
            -f context='CrabNebula / macOS' \
            -f description="$desc" \
            -f target_url="$PR_URL"

  # Manual attestation: an authorized crabnebula:verified labeler posts success; an unauthorized one
  # is removed and posts nothing.
  verify-label:
    if: github.event.action == 'labeled' && github.event.label.name == 'crabnebula:verified'
    runs-on: ubuntu-latest
    steps:
      - name: Attest or reject
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          SENDER: ${{ github.event.sender.login }}
          ALLOW: ${{ env.AUTHORIZED_LABELERS }}
        run: |
          if echo "$ALLOW" | jq -e --arg s "$SENDER" 'index($s) != null' >/dev/null; then
            gh api "repos/$REPO/statuses/$SHA" -f state=success -f context='CrabNebula / macOS' \
              -f description="macOS CrabNebula verified by $SENDER." -f target_url="$PR_URL"
          else
            echo "::warning::Unauthorized labeler $SENDER applied crabnebula:verified — removing."
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/crabnebula%3Averified" || true
          fi

  # Defense in depth: an unauthorized crabnebula:run is removed here too (crabnebula-mirror.yml
  # independently gates the positive path on the same allowlist).
  guard-run-label:
    if: github.event.action == 'labeled' && github.event.label.name == 'crabnebula:run'
    runs-on: ubuntu-latest
    steps:
      - name: Reject unauthorized labeler
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SENDER: ${{ github.event.sender.login }}
          ALLOW: ${{ env.AUTHORIZED_LABELERS }}
        run: |
          if ! echo "$ALLOW" | jq -e --arg s "$SENDER" 'index($s) != null' >/dev/null; then
            echo "::warning::Unauthorized labeler $SENDER applied crabnebula:run — removing."
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/crabnebula%3Arun" || true
          fi
