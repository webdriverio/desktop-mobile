name: CrabNebula macOS Gate

# Closes the fork coverage gap: on a fork PR the macOS CrabNebula E2E leg is skipped (no CN_API_KEY
# for forks), so it could otherwise merge green without ever running. This posts a required
# `CrabNebula / macOS` status that blocks such a PR until it is verified. See
# docs/security/crabnebula-fork-verification.md.
#
# The status is event-driven and never derived from label state: `reset-on-code` (re)posts pending
# on new code, and success is only ever posted by an authorized action — an authorized
# `crabnebula:verified` labeler here, or the keyed mirror run. So an unauthorized or un-removed label
# can never greenlight the gate. GitHub has no per-label permission, hence identity is checked here.
#
# pull_request_target for the writable statuses/labels token; this workflow runs NO PR code
# (detect-changes.ts is the trusted base copy and only classifies a list of changed paths).

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  statuses: write
  pull-requests: write

concurrency:
  group: crabnebula-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  # Logins allowed to attest a verification / authorise a keyed run — keep this to the people who do
  # the fork-diff review, NOT all repo admins. Set repo variable CRABNEBULA_LABELERS (a JSON array);
  # the ["goosewobbler"] fallback is a bootstrap default, duplicated in crabnebula-mirror{,-run}.yml —
  # keep the three identical, or set the repo var (which makes the fallback moot) to avoid drift.
  AUTHORIZED_LABELERS: ${{ vars.CRABNEBULA_LABELERS || '["goosewobbler"]' }}

jobs:
  # (Re)post the required status: pending for a fork PR that touches Tauri, success otherwise, via the
  # real detect-changes.ts classifier so it can't drift from what routes a PR to the Tauri E2E
  # pipeline. Runs on new code, and on removal of crabnebula:verified so an attestation can be revoked
  # without pushing a commit. A new push also clears stale attestation labels.
  reset-on-code:
    if: >-
      contains(fromJSON('["opened","reopened","synchronize"]'), github.event.action) ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'crabnebula:verified')
    runs-on: ubuntu-latest
    steps:
      # Checkout + Node are only needed to classify a fork PR; internal PRs post success without them,
      # so a transient setup failure can't strand an internal PR at "Expected".
      - name: Checkout base (trusted classifier)
        if: github.event.pull_request.head.repo.fork == true
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: github.event.pull_request.head.repo.fork == true
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Clear stale attestation labels
        # On a new push and on reopen — a stale crabnebula:verified label can't be re-applied to
        # re-verify (re-adding a present label fires no `labeled` event), so it must be cleared.
        # Deleting it here can't spawn a duplicate reset-on-code run: a GITHUB_TOKEN label edit doesn't
        # create a new workflow run (recursion guard), so the `unlabeled` trigger fires only for a human.
        if: github.event.action == 'synchronize' || github.event.action == 'reopened'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          for L in crabnebula:verified crabnebula:run; do
            enc=$(jq -rn --arg l "$L" '$l|@uri')
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/$enc" >/dev/null 2>&1 || true
          done

      - name: Post required status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          # Only an explicit fork == false is internal (success without classifying, so no
          # checkout/API/classifier failure strands an internal PR at "Expected"). A fork — or a null
          # head.repo (deleted/detached fork) rendering empty — takes the fork path and fails closed,
          # matching ci.yml's `fork != true`; a null must never green-light this required check.
          state=success
          desc="Not applicable (internal PR or no Tauri changes)."
          if [ "$IS_FORK" != "false" ]; then
            # Classify defensively; a transient API/classifier failure fails safe to pending
            # (recoverable by re-run/push), never a false green and never an unposted required check.
            run_tauri=""; run_lint_only=""
            # Capture each API call's exit code explicitly (assignment exit == command exit). A pipe
            # would swallow a gh failure and yield "[]", so both fetches must succeed before we trust
            # the file list; otherwise run_tauri stays empty -> pending. The Files API caps at 3000
            # files, so if the PR changed more than that the list is truncated and could miss Tauri
            # paths -> stay unclassified -> pending. (Below the cap, changed_files can differ from the
            # list length on binary/rename accounting without being truncated, so don't gate on that.)
            if files_raw="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' 2>/dev/null)" \
               && total="$(gh api "repos/$REPO/pulls/$PR" --jq '.changed_files' 2>/dev/null)"; then
              if [ "$total" -le 3000 ]; then
                files_json="$(printf '%s' "$files_raw" | jq -R . | jq -s -c .)"
                tmp="$(mktemp)"
                if CHANGED_FILES="$files_json" GITHUB_OUTPUT="$tmp" node scripts/detect-changes.ts >/dev/null 2>&1; then
                  run_tauri="$(sed -n 's/^run_tauri=//p' "$tmp")"
                  run_lint_only="$(sed -n 's/^run_lint_only=//p' "$tmp")"
                fi
              fi
            fi
            if [ -z "$run_tauri" ]; then
              state=pending
              desc="Gate could not classify changes — re-run the job or push to retry."
            elif [ "$run_tauri" = "true" ] && [ "$run_lint_only" != "true" ]; then
              state=pending
              desc="Blocked: macOS CrabNebula skipped on this fork. Review, verify, then add crabnebula:verified."
            fi
          fi
          echo "fork=$IS_FORK -> $state"
          # Retry: this posts the required check, so a transient failure must not strand the PR at
          # "Expected". If all attempts fail, exit non-zero so the job goes red (visible + re-runnable)
          # rather than exiting 0 with the check never posted.
          posted=false
          for _ in 1 2 3; do
            if gh api "repos/$REPO/statuses/$SHA" \
              -f state="$state" -f context='CrabNebula / macOS' \
              -f description="$desc" -f target_url="$PR_URL"; then posted=true; break; fi
            sleep 5
          done
          [ "$posted" = true ] || { echo "::error::Failed to post CrabNebula / macOS status after retries."; exit 1; }

  # Manual attestation: an authorized crabnebula:verified labeler posts success; an unauthorized one
  # is removed and posts nothing.
  verify-label:
    if: github.event.action == 'labeled' && github.event.label.name == 'crabnebula:verified'
    runs-on: ubuntu-latest
    steps:
      - name: Attest or reject
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          SENDER: ${{ github.event.sender.login }}
          ALLOW: ${{ env.AUTHORIZED_LABELERS }}
        run: |
          if echo "$ALLOW" | jq -e --arg s "$SENDER" 'index($s) != null' >/dev/null; then
            gh api "repos/$REPO/statuses/$SHA" -f state=success -f context='CrabNebula / macOS' \
              -f description="macOS CrabNebula verified by $SENDER." -f target_url="$PR_URL"
          else
            echo "::warning::Unauthorized labeler $SENDER applied crabnebula:verified — removing."
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/crabnebula%3Averified" || true
          fi

  # Defense in depth: an unauthorized crabnebula:run is removed here too (crabnebula-mirror.yml
  # independently gates the positive path on the same allowlist).
  guard-run-label:
    if: github.event.action == 'labeled' && github.event.label.name == 'crabnebula:run'
    runs-on: ubuntu-latest
    steps:
      - name: Reject unauthorized labeler
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SENDER: ${{ github.event.sender.login }}
          ALLOW: ${{ env.AUTHORIZED_LABELERS }}
        run: |
          if ! echo "$ALLOW" | jq -e --arg s "$SENDER" 'index($s) != null' >/dev/null; then
            echo "::warning::Unauthorized labeler $SENDER applied crabnebula:run — removing."
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/crabnebula%3Arun" || true
          fi
