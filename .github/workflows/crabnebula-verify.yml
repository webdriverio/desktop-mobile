name: CrabNebula macOS Gate

# Posts the required `CrabNebula / macOS` status that blocks a fork PR until macOS CrabNebula is
# verified (the leg is skipped on forks — no CN_API_KEY — so the PR could otherwise merge green).
# Runs NO PR code (detect-changes.ts is the trusted base copy); the status is event-driven, so a new
# push re-posts pending and a stale attestation label can't persist. See CONTRIBUTING.md.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  statuses: write
  pull-requests: write

concurrency:
  group: crabnebula-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}

jobs:
  # (Re)posts the required status via the real detect-changes.ts classifier, so it can't drift from
  # what routes a PR to the Tauri pipeline. The unlabeled trigger lets an attestation be revoked without a push.
  reset-on-code:
    if: >-
      contains(fromJSON('["opened","reopened","synchronize"]'), github.event.action) ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'crabnebula:verified')
    runs-on: ubuntu-latest
    steps:
      # Only fork PRs need the classifier checkout/Node — skip it for internal PRs so a setup failure
      # can't strand them at "Expected". full_name (not fork == true) so a null/detached head.repo still classifies.
      - name: Checkout base (trusted classifier)
        if: github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Clear stale attestation labels
        # Clear stale attestation labels on new code: a present label can't re-fire `labeled`, so it
        # must be removed before it can re-verify. (A GITHUB_TOKEN label edit fires no workflow, so no loop.)
        if: github.event.action == 'synchronize' || github.event.action == 'reopened'
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          for L in crabnebula:verified crabnebula:run; do
            enc=$(jq -rn --arg l "$L" '$l|@uri')
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/$enc" >/dev/null 2>&1 || true
          done

      - name: Post required status
        if: always()
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          # Only an explicit "false" is internal → instant success. A fork, or a null/empty head.repo,
          # takes the fork path and fails closed — a null must never green-light this required check.
          state=success
          desc="Not applicable (internal PR or no Tauri changes)."
          if [ "$IS_FORK" != "false" ]; then
            # Any API/classifier failure fails safe to pending (re-runnable), never a false green.
            run_tauri=""; run_lint_only=""; truncated=false
            # Chained assignments, not a pipe, so a gh failure isn't masked as "[]" (both fetches must
            # succeed). Files API caps at 3000; above it the list is truncated and may miss Tauri paths ->
            # manual path. GITHUB_STEP_SUMMARY=/dev/null keeps detect-changes.ts's table out of the gate.
            if files_raw="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' 2>/dev/null)" \
               && total="$(gh api "repos/$REPO/pulls/$PR" --jq '.changed_files' 2>/dev/null)"; then
              if [ "$total" -le 3000 ]; then
                files_json="$(printf '%s' "$files_raw" | jq -R . | jq -s -c .)"
                tmp="$(mktemp)"
                if CHANGED_FILES="$files_json" GITHUB_OUTPUT="$tmp" GITHUB_STEP_SUMMARY=/dev/null node scripts/detect-changes.ts >/dev/null 2>&1; then
                  run_tauri="$(sed -n 's/^run_tauri=//p' "$tmp")"
                  run_lint_only="$(sed -n 's/^run_lint_only=//p' "$tmp")"
                fi
              else
                truncated=true
              fi
            fi
            if [ "$truncated" = "true" ]; then
              state=pending
              desc="Too many files to classify automatically (>3000) — review, then add crabnebula:verified."
            elif [ -z "$run_tauri" ]; then
              state=pending
              desc="Gate could not classify changes — re-run the job or push to retry."
            elif [ "$run_tauri" = "true" ] && [ "$run_lint_only" != "true" ]; then
              state=pending
              desc="Blocked: macOS CrabNebula skipped on this fork. Review, verify, then add crabnebula:verified."
            fi
          fi
          echo "fork=$IS_FORK -> $state"
          # exit non-zero on a failed post: a required check left unposted sits invisibly at "Expected".
          gh api "repos/$REPO/statuses/$SHA" -f state="$state" -f context='CrabNebula / macOS' \
            -f description="$desc" -f target_url="$PR_URL" \
            || { echo "::error::Failed to post CrabNebula / macOS status."; exit 1; }

  # Manual attestation: applying crabnebula:verified posts success (label access is admin-only).
  verify-label:
    if: github.event.action == 'labeled' && github.event.label.name == 'crabnebula:verified'
    runs-on: ubuntu-latest
    steps:
      - name: Attest
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          # exit non-zero on a failed post: the present label can't re-fire `labeled`, so re-run to recover.
          gh api "repos/$REPO/statuses/$SHA" -f state=success -f context='CrabNebula / macOS' \
            -f description="macOS CrabNebula verified by $SENDER." -f target_url="$PR_URL" \
            || { echo "::error::Failed to post verified status."; exit 1; }
