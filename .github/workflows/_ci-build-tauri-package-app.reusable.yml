name: Build Tauri Package Test App
# Description: Builds Tauri package test application and creates shareable artifacts

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      os:
        description: 'OS of runner'
        required: true
        type: string
      build_id:
        description: 'Build ID from the main build job'
        type: string
        required: false
      artifact_size:
        description: 'Size of the build artifact in bytes'
        type: string
        required: false
      cache_key:
        description: 'Cache key to use for downloading artifacts'
        type: string
        required: false
    outputs:
      build_id:
        description: 'Unique identifier for this build'
        value: ${{ jobs.build-tauri-package-app.outputs.build_id }}
      build_date:
        description: 'Timestamp when the build completed'
        value: ${{ jobs.build-tauri-package-app.outputs.build_date }}
      artifact_size:
        description: 'Size of the build artifact in bytes'
        value: ${{ jobs.build-tauri-package-app.outputs.artifact_size }}
      cache_key:
        description: 'Cache key used for artifact uploads, can be passed to download actions'
        value: ${{ jobs.build-tauri-package-app.outputs.cache_key }}

env:
  TURBO_TELEMETRY_DISABLED: 1
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  build-tauri-package-app:
    name: Build
    runs-on: ${{ inputs.os }}
    outputs:
      build_id: ${{ steps.build-info.outputs.build_id }}
      build_date: ${{ steps.build-info.outputs.build_date }}
      artifact_size: ${{ steps.upload-archive.outputs.size || '0' }}
      cache_key: ${{ steps.upload-archive.outputs.cache_key }}
    steps:
      - name: 👷 Checkout Repository
        uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: 🛠️ Setup Development Environment
        uses: ./.github/workflows/actions/setup-workspace
        with:
          node-version: '24'

      # Download the pre-built packages from the main build job
      # This ensures workspace dependencies (e.g. @wdio/native-spy dist/) are available
      - name: 📦 Download Package Build Artifacts
        uses: ./.github/workflows/actions/download-archive
        with:
          name: wdio-desktop-mobile
          path: wdio-desktop-mobile-build
          filename: artifact.zip
          cache_key_prefix: wdio-desktop-build
          exact_cache_key: ${{ inputs.cache_key || github.run_id && format('{0}-{1}-{2}-{3}{4}', 'Linux', 'wdio-desktop-build', 'wdio-desktop-mobile', github.run_id, github.run_attempt > 1 && format('-rerun{0}', github.run_attempt) || '') || '' }}

      - name: 🦀 Install Rust Toolchain
        shell: bash
        run: rustup update stable && rustup default stable

      - name: 🦀 Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'
          cache-on-failure: true
          cache-targets: false

      - name: 🔧 Fix ARM64 Package Sources (Linux)
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        shell: bash
        run: |
          echo "Fixing ARM64 package sources for Ubuntu..."
          # Add proper arm64 sources for jammy
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/arm64-jammy.list > /dev/null
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64-jammy.list > /dev/null
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy-backports main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64-jammy.list > /dev/null
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64-jammy.list > /dev/null

          # Ensure default sources only use amd64
          sudo sed -i -e 's/^deb http/deb [arch=amd64] http/' /etc/apt/sources.list
          sudo sed -i -e 's/^deb mirror/deb [arch=amd64] mirror/' /etc/apt/sources.list

          sudo apt-get update

      - name: 🦀 Install Tauri Dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "Installing Tauri dependencies for Linux..."
          # Only add archive.ubuntu.com for amd64, arm64 sources are handled above
          if [ "$(uname -m)" != "aarch64" ]; then
            echo "deb http://archive.ubuntu.com/ubuntu jammy main universe" | sudo tee -a /etc/apt/sources.list > /dev/null
          fi
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libsoup2.4-dev \
            libjavascriptcoregtk-4.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            libasound2-dev \
            libx11-dev \
            libxext-dev \
            libxfixes-dev \
            libxrender-dev \
            libxrandr-dev \
            libxss-dev \
            libxtst-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxdamage-dev \
            libxinerama-dev \
            libxcb1-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-render0-dev \
            libxcb-randr0-dev \
            libxcb-xinerama0-dev \
            libxcb-xkb-dev \
            libxcb-image0-dev \
            libxcb-util0-dev \
            libxcb-icccm4-dev \
            libxcb-ewmh-dev \
            libxcb-dri2-0-dev

      - name: 📊 Generate Build Information
        id: build-info
        shell: bash
        run: |
          echo "build_id=$(date +%s)-${{ github.run_id }}-${{ runner.os }}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"

      # Debug: Check environment before build
      - name: 🔍 Debug Tauri Package App Build Environment
        shell: bash
        run: |
          echo "🔍 Debugging Tauri package test app build environment..."
          APP_DIR="fixtures/package-tests/tauri-app/src-tauri"

          echo ""
          echo "=== Checking app directory structure ==="
          if [ -d "$APP_DIR" ]; then
            echo "✅ App directory exists: $APP_DIR"
            ls -la "$APP_DIR" || echo "Failed to list app directory"
          else
            echo "❌ App directory NOT found: $APP_DIR"
          fi

          echo ""
          echo "=== Checking capabilities file ==="
          if [ -f "$APP_DIR/capabilities/default.json" ]; then
            echo "✅ Capabilities file exists"
            echo "Capabilities file contents:"
            cat "$APP_DIR/capabilities/default.json" || echo "Failed to read capabilities file"

            # Check if identifier is "default"
            if grep -q '"identifier": "default"' "$APP_DIR/capabilities/default.json"; then
              echo "✅ Capability identifier is 'default'"
            else
              echo "❌ Capability identifier is NOT 'default'"
              echo "Actual identifier:"
              grep '"identifier"' "$APP_DIR/capabilities/default.json" || echo "No identifier found"
            fi

            # Check for plugin permissions
            if grep -q "wdio:" "$APP_DIR/capabilities/default.json"; then
              echo "✅ Plugin permissions found in capabilities file"
              echo "Plugin permissions:"
              grep "wdio:" "$APP_DIR/capabilities/default.json" || echo "Failed to grep"
            else
              echo "⚠️  No plugin permissions found in capabilities file"
            fi
          else
            echo "❌ Capabilities file NOT found at $APP_DIR/capabilities/default.json"
            echo "Checking if capabilities directory exists:"
            ls -la "$APP_DIR/capabilities/" 2>/dev/null || echo "Capabilities directory does not exist"
          fi

          echo ""
          echo "=== Checking build.rs ==="
          if [ -f "$APP_DIR/build.rs" ]; then
            echo "✅ build.rs exists"
            echo "build.rs contents:"
            cat "$APP_DIR/build.rs" || echo "Failed to read build.rs"
          else
            echo "❌ build.rs NOT found"
          fi

          echo ""
          echo "=== Checking plugin availability ==="
          if [ -d "packages/tauri-plugin" ]; then
            echo "✅ Plugin directory exists"

            if [ -d "packages/tauri-plugin/permissions" ]; then
              echo "✅ Plugin permissions directory exists"
              echo "Plugin permissions files:"
              ls -la "packages/tauri-plugin/permissions/" || echo "Failed to list permissions"

              if [ -f "packages/tauri-plugin/permissions/default.toml" ]; then
                echo "✅ Plugin default.toml exists"
                echo "Plugin permissions file contents:"
                cat "packages/tauri-plugin/permissions/default.toml" || echo "Failed to read"
              else
                echo "❌ Plugin default.toml NOT found"
              fi
            else
              echo "❌ Plugin permissions directory NOT found"
            fi

            if [ -f "packages/tauri-plugin/build.rs" ]; then
              echo "✅ Plugin build.rs exists"
            else
              echo "❌ Plugin build.rs NOT found"
            fi
          else
            echo "❌ Plugin directory NOT found"
          fi

          echo ""
          echo "=== Checking Cargo.toml ==="
          if [ -f "$APP_DIR/Cargo.toml" ]; then
            echo "✅ Cargo.toml exists"
            if grep -q "tauri-plugin-wdio" "$APP_DIR/Cargo.toml"; then
              echo "✅ Plugin dependency found in Cargo.toml"
              echo "Plugin dependency:"
              grep -A2 "tauri-plugin-wdio" "$APP_DIR/Cargo.toml" || echo "Failed to grep"
            else
              echo "❌ Plugin dependency NOT found in Cargo.toml"
            fi
          else
            echo "❌ Cargo.toml NOT found"
          fi

          echo ""
          echo "=== Checking for existing gen directory ==="
          if [ -d "$APP_DIR/gen" ]; then
            echo "⚠️  gen directory already exists (should be cleaned before build)"
            echo "Contents:"
            find "$APP_DIR/gen" -type f | head -10 || echo "gen directory is empty"

            echo ""
            echo "Checking existing ACL manifest (if present):"
            if [ -f "$APP_DIR/gen/schemas/acl-manifests.json" ]; then
              echo "Existing ACL manifest found:"
              jq 'keys' "$APP_DIR/gen/schemas/acl-manifests.json" 2>/dev/null || head -20 "$APP_DIR/gen/schemas/acl-manifests.json"

              if grep -q '"default"' "$APP_DIR/gen/schemas/acl-manifests.json" 2>/dev/null; then
                echo "✅ Existing manifest has 'default' capability"
              else
                echo "❌ Existing manifest does NOT have 'default' capability"
              fi

              if grep -q '"wdio"' "$APP_DIR/gen/schemas/acl-manifests.json" 2>/dev/null; then
                echo "✅ Existing manifest has 'wdio' plugin"
              else
                echo "⚠️  Existing manifest does NOT have 'wdio' plugin"
              fi
            fi
          else
            echo "✅ gen directory does not exist (will be created during build)"
          fi

      # CRITICAL: Clean gen directory before build to ensure fresh ACL manifest generation
      # The gen directory contains generated ACL manifests that must be regenerated with current plugin permissions
      - name: 🧹 Clean Gen Directory
        shell: bash
        run: |
          APP_DIR="fixtures/package-tests/tauri-app/src-tauri"
          if [ -d "$APP_DIR/gen" ]; then
            echo "Cleaning gen directory to ensure fresh ACL manifest generation..."
            rm -rf "$APP_DIR/gen"
            echo "✅ gen directory cleaned"
          else
            echo "gen directory does not exist, nothing to clean"
          fi

      - name: 🏗️ Build Tauri Package Test App
        run: pnpm exec turbo run build --filter=tauri-app-example --only
        shell: bash

      # Debug: Check if ACL manifest was generated after build
      - name: 🔍 Debug ACL Manifest Generation (After Build)
        if: failure()
        shell: bash
        run: |
          echo "🔍 Checking build output after failure..."
          APP_DIR="fixtures/package-tests/tauri-app/src-tauri"
          GEN_DIR="$APP_DIR/gen"
          ACL_MANIFEST="$GEN_DIR/schemas/acl-manifests.json"

          echo ""
          echo "=== Checking if gen directory was created ==="
          if [ -d "$GEN_DIR" ]; then
            echo "✅ gen directory exists"
            echo "Contents:"
            find "$GEN_DIR" -type f | head -20 || echo "gen directory is empty"

            if [ -f "$ACL_MANIFEST" ]; then
              echo "✅ ACL manifest exists"
              echo "ACL manifest keys:"
              jq 'keys' "$ACL_MANIFEST" 2>/dev/null || head -50 "$ACL_MANIFEST"

              if grep -q '"default"' "$ACL_MANIFEST" 2>/dev/null; then
                echo "✅ 'default' capability found in ACL manifest"
              else
                echo "❌ 'default' capability NOT found in ACL manifest"
              fi

              if grep -q '"wdio"' "$ACL_MANIFEST" 2>/dev/null; then
                echo "✅ 'wdio' plugin found in ACL manifest"
              else
                echo "⚠️  'wdio' plugin NOT found in ACL manifest"
              fi
            else
              echo "❌ ACL manifest NOT found at $ACL_MANIFEST"
            fi
          else
            echo "❌ gen directory NOT created - ACL manifest generation failed"
          fi

          echo ""
          echo "=== Checking plugin build output ==="
          if [ -d "packages/tauri-plugin/target" ]; then
            echo "Plugin target directory exists"
            echo "Looking for permissions in plugin target:"
            find "packages/tauri-plugin/target" -type d -name "permissions" | head -5 || echo "No permissions directories found"

            echo ""
            echo "Looking for OUT_DIR permissions:"
            find "packages/tauri-plugin/target" -path "*/permissions/wdio/*" -type f | head -5 || echo "No plugin permissions files found in OUT_DIR"
          fi

          echo ""
          echo "=== Checking app build output for plugin permissions ==="
          if [ -d "$APP_DIR/target" ]; then
            echo "App target directory exists"
            echo "Looking for plugin permissions in app target:"
            find "$APP_DIR/target" -type d -name "permissions" | head -5 || echo "No permissions directories found"

            echo ""
            echo "Looking for plugin OUT_DIR in app target:"
            find "$APP_DIR/target" -path "*/build/tauri-plugin-*/out/permissions/wdio/*" -type f | head -5 || echo "No plugin permissions found in app target"
          fi

      - name: 📦 Upload Tauri Package Test App Binary
        id: upload-archive
        uses: ./.github/workflows/actions/upload-archive
        with:
          name: tauri-package-app-${{ runner.os }}-${{ runner.arch == 'ARM64' && 'ARM64' || 'x64' }}
          output: tauri-package-app-${{ runner.os }}-${{ runner.arch == 'ARM64' && 'ARM64' || 'x64' }}/artifact.zip
          paths: fixtures/package-tests/tauri-app/src-tauri/target
          cache_key_prefix: tauri-package-app
          retention_days: '90'

